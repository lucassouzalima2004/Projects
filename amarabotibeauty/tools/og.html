<!doctype html>
<!-- Imagem de prévia do link (assets/img/og-image.jpg): abra num navegador com a janela em 1200×630 e tire um print.
     Não vai para o ar. -->
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..800;1,6..96,400..800&family=Great+Vibes&family=Jost:wght@300..600&display=swap">
  <style>
    * { box-sizing: border-box; margin: 0; }
    body { width: 1200px; height: 630px; overflow: hidden; background: #0B0907; color: #F5EBDD; font-family: Jost, sans-serif; }
    .og {
      position: relative; width: 1200px; height: 630px; display: grid; grid-template-columns: 470px 1fr; align-items: center; gap: 40px;
      padding: 0 80px 0 70px;
      background:
        radial-gradient(40% 60% at 22% 50%, rgba(226, 182, 90, .28), transparent 70%),
        radial-gradient(30% 40% at 85% 15%, rgba(242, 180, 160, .1), transparent 70%),
        #0B0907;
    }
    .medal { position: relative; width: 400px; height: 400px; margin: auto; }
    .medal img { width: 100%; height: 100%; border-radius: 50%; box-shadow: 0 0 0 1px rgba(226, 182, 90, .6), 0 0 0 9px #0B0907, 0 0 0 10px rgba(226, 182, 90, .35), 0 0 90px rgba(226, 182, 90, .3); }
    .medal::before { content: ""; position: absolute; inset: -34px; border-radius: 50%; border: 1px solid rgba(226, 182, 90, .3); }
    .eyebrow { font-size: 19px; font-weight: 500; letter-spacing: .32em; text-transform: uppercase; color: #E2B65A; }
    h1 { margin-top: 18px; font: 500 74px/1.02 "Bodoni Moda", serif; letter-spacing: -.02em; }
    h1 em {
      font-style: italic;
      background: linear-gradient(100deg, #A8761F, #E2B65A 30%, #FFF1C4 50%, #D9A441 70%, #A8761F);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .line { width: 340px; height: 2px; margin: 26px 0 24px; background: linear-gradient(90deg, #E2B65A, transparent); }
    p { font-size: 26px; color: rgba(245, 235, 221, .8); }
    .wa { display: inline-flex; align-items: center; gap: 12px; margin-top: 26px; padding: 14px 26px; border-radius: 999px; background: linear-gradient(100deg, #A8761F, #E2B65A 30%, #FFF1C4 50%, #D9A441 70%, #A8761F); color: #1A1206; font-size: 22px; font-weight: 600; letter-spacing: .1em; }
    .wa svg { width: 26px; height: 26px; }
    .spark { position: absolute; color: #F7DE9C; }
  </style>
</head>
<body>
  <div class="og">
    <div class="medal"><img src="../assets/img/logo.webp" alt=""></div>
    <div>
      <p class="eyebrow">✦ O Boticário na Itália ✦</p>
      <h1>A beleza do <em>Brasil</em>, pertinho de você.</h1>
      <div class="line"></div>
      <p>Perfumes, cremes, maquiagem e kits.</p>
      <span class="wa"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M17.47 14.38c-.3-.15-1.76-.87-2.03-.97-.27-.1-.47-.15-.67.15-.2.3-.77.97-.94 1.16-.17.2-.35.22-.64.07-.3-.15-1.26-.46-2.39-1.47-.88-.79-1.48-1.76-1.65-2.06-.17-.3-.02-.46.13-.6.13-.14.3-.35.45-.52.15-.18.2-.3.3-.5.1-.2.05-.37-.03-.52-.07-.15-.67-1.6-.91-2.2-.24-.58-.49-.5-.67-.51h-.57c-.2 0-.52.07-.79.37-.27.3-1.04 1.02-1.04 2.48s1.06 2.88 1.21 3.07c.15.2 2.1 3.2 5.08 4.49.71.3 1.26.49 1.7.63.71.22 1.36.19 1.87.12.57-.09 1.76-.72 2-1.41.25-.7.25-1.29.18-1.41-.08-.13-.28-.2-.57-.35zM12.05 21.8h-.01a9.9 9.9 0 0 1-5.03-1.38l-.36-.21-3.74.98 1-3.65-.24-.37a9.86 9.86 0 0 1-1.51-5.26c0-5.45 4.44-9.88 9.89-9.88a9.83 9.83 0 0 1 6.99 2.9 9.83 9.83 0 0 1 2.89 6.99c0 5.45-4.44 9.88-9.88 9.88zm8.41-18.3A11.82 11.82 0 0 0 12.05 0C5.5 0 .16 5.34.16 11.89c0 2.1.55 4.14 1.59 5.95L.06 24l6.3-1.65a11.88 11.88 0 0 0 5.68 1.45h.01c6.55 0 11.89-5.34 11.89-11.9 0-3.17-1.24-6.16-3.48-8.4z"/></svg>Peça pelo WhatsApp</span>
    </div>
    <span class="spark" style="left:520px;top:70px;font-size:22px">✦</span>
    <span class="spark" style="left:1110px;top:540px;font-size:16px;opacity:.7">✦</span>
    <span class="spark" style="left:60px;top:560px;font-size:12px;opacity:.6">✦</span>
  </div>
</body>
</html>
