<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Amarabotibeauty · Produtos O Boticário na Itália</title>
  <meta name="description" content="Perfumes, cremes, maquiagem e kits O Boticário na Itália. Escolha na vitrine e faça o pedido pelo WhatsApp.">
  <meta name="theme-color" content="#0B0907">
  <meta name="color-scheme" content="dark">
  <script>document.documentElement.classList.add('js')</script>

  <!-- Prévia do link no WhatsApp/Instagram/Facebook. O WhatsApp só mostra a imagem com o endereço completo:
       o deploy (.github/workflows/deploy-amarabotibeauty.yml) troca o og:image sozinho. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Amarabotibeauty">
  <meta property="og:title" content="Amarabotibeauty · O Boticário na Itália">
  <meta property="og:description" content="Perfumes, cremes e kits O Boticário. Escolha na vitrine e peça pelo WhatsApp.">
  <meta property="og:image" content="assets/img/og-image.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:locale" content="pt_BR">
  <meta property="og:locale:alternate" content="it_IT">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" href="assets/img/favicon.png" type="image/png" sizes="64x64">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <link rel="preload" href="assets/img/logo.webp" as="image" type="image/webp">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..800;1,6..96,400..800&family=Great+Vibes&family=Jost:wght@300..600&display=swap">
  <link rel="stylesheet" href="assets/css/styles.css">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Store",
    "name": "Amarabotibeauty",
    "description": "Revenda de produtos O Boticário na Itália: perfumes, cuidados para o corpo, cabelos, maquiagem e kits.",
    "image": "assets/img/og-image.jpg",
    "logo": "assets/img/logo.webp",
    "telephone": "+39 351 420 4866",
    "currenciesAccepted": "EUR",
    "address": { "@type": "PostalAddress", "addressCountry": "IT" }
  }
  </script>
</head>
<body>
  <a class="skip-link" href="#vitrine" data-t="ui.skip"></a>
  <div class="progress" aria-hidden="true"><i></i></div>

  <!-- Ícones e gradientes usados nos desenhos dos produtos -->
  <svg class="sr-defs" width="0" height="0" aria-hidden="true" focusable="false">
    <defs>
      <linearGradient id="gFoil" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#7A5212"/>
        <stop offset=".28" stop-color="#E4B95C"/>
        <stop offset=".45" stop-color="#FFF0BC"/>
        <stop offset=".62" stop-color="#C99335"/>
        <stop offset=".82" stop-color="#8E6219"/>
        <stop offset="1" stop-color="#EBCB7E"/>
      </linearGradient>
      <linearGradient id="gFoilV" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#6F4A10"/>
        <stop offset=".22" stop-color="#D6A649"/>
        <stop offset=".4" stop-color="#FFF1C2"/>
        <stop offset=".58" stop-color="#D19C3E"/>
        <stop offset="1" stop-color="#7C5414"/>
      </linearGradient>
      <linearGradient id="gShade" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#000" stop-opacity=".5"/>
        <stop offset=".2" stop-color="#000" stop-opacity=".05"/>
        <stop offset=".36" stop-color="#fff" stop-opacity=".16"/>
        <stop offset=".5" stop-color="#000" stop-opacity="0"/>
        <stop offset=".8" stop-color="#000" stop-opacity=".18"/>
        <stop offset="1" stop-color="#000" stop-opacity=".55"/>
      </linearGradient>
      <linearGradient id="gDepth" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#fff" stop-opacity=".14"/>
        <stop offset=".45" stop-color="#fff" stop-opacity="0"/>
        <stop offset="1" stop-color="#000" stop-opacity=".38"/>
      </linearGradient>
      <linearGradient id="gGlass" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#fff" stop-opacity=".2"/>
        <stop offset=".25" stop-color="#fff" stop-opacity=".05"/>
        <stop offset=".75" stop-color="#fff" stop-opacity=".03"/>
        <stop offset="1" stop-color="#fff" stop-opacity=".16"/>
      </linearGradient>
      <linearGradient id="gGloss" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#fff" stop-opacity="0"/>
        <stop offset=".2" stop-color="#fff" stop-opacity=".7"/>
        <stop offset=".7" stop-color="#fff" stop-opacity=".25"/>
        <stop offset="1" stop-color="#fff" stop-opacity="0"/>
      </linearGradient>
      <radialGradient id="gFloor">
        <stop offset="0" stop-color="#000" stop-opacity=".75"/>
        <stop offset="1" stop-color="#000" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="gStroke" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#8C5F17"/>
        <stop offset=".3" stop-color="#F4D78A"/>
        <stop offset=".55" stop-color="#C99335"/>
        <stop offset=".8" stop-color="#FFF0BC"/>
        <stop offset="1" stop-color="#9C6A1C"/>
      </linearGradient>
    </defs>

    <symbol id="i-bag" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h14l-1.2 11.2a2 2 0 0 1-2 1.8H8.2a2 2 0 0 1-2-1.8z"/><path d="M9 10.5V7a3 3 0 0 1 6 0v3.5"/></g></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" d="M4 12h15M13 6l6 6-6 6"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" d="M12 4v15M6 13l6 6 6-6"/></symbol>

    <symbol id="i-minus" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" d="M5 12h14"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" d="M6 6l12 12M18 6 6 18"/></symbol>

    <symbol id="i-chev-r" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path fill="currentColor" d="M7 5h3.2v14H7zM13.8 5H17v14h-3.2z"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path fill="currentColor" d="M8 5.2v13.6L19 12z"/></symbol>
    <symbol id="i-bell" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16.5V11a6 6 0 0 1 12 0v5.5l1.5 1.5h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/></g></symbol>

  <!-- ================================================================ TOPO -->
  <header class="hdr" id="hdr">
    <div class="hdr__in">
      <button class="icon-btn hdr__burger" type="button" aria-controls="menu" aria-expanded="false" data-menu-open>
        <svg aria-hidden="true"><use href="#i-menu"/></svg><span class="sr-only" data-t="ui.menu"></span>
      </button>

      <nav class="hdr__nav hdr__nav--l" aria-label="Principal">
        <a href="#vitrine" data-t="nav.shop"></a>
        <a href="#amados" data-t="nav.loved"></a>
        <a href="#como" data-t="nav.how"></a>
      </nav>

      <a class="wordmark" href="#topo" data-brand>Amarabotibeauty</a>

      <div class="hdr__r">
        <nav class="hdr__nav" aria-label="Mais">
          <a href="#sobre" data-t="nav.about"></a>
          <a href="#duvidas" data-t="nav.faq"></a>
        </nav>
        <button class="lang" type="button" data-lang-toggle>
          <span data-l="pt">PT</span><span data-l="it">IT</span><i aria-hidden="true"></i>
        </button>
        <button class="icon-btn cart-btn" type="button" data-cart-open>
          <svg aria-hidden="true"><use href="#i-bag"/></svg>
          <span class="sr-only" data-t="ui.cart"></span>
          <b class="cart-btn__n" data-cart-count hidden>0</b>
        </button>
      </div>
    </div>
  </header>

  <!-- Menu do celular -->
  <dialog class="menu" id="menu" aria-label="Menu">
    <button class="icon-btn menu__close" type="button" data-close>
      <svg aria-hidden="true"><use href="#i-close"/></svg><span class="sr-only" data-t="ui.close"></span>
    </button>
    <nav class="menu__nav" aria-label="Menu">
      <a href="#vitrine" data-t="nav.shop"></a>
      <a href="#amados" data-t="nav.loved"></a>
      <a href="#como" data-t="nav.how"></a>
      <a href="#sobre" data-t="nav.about"></a>
      <a href="#duvidas" data-t="nav.faq"></a>
    </nav>
    <a class="btn btn--gold menu__wa" data-wa href="#" target="_blank" rel="noopener">
      <svg aria-hidden="true"><use href="#i-wa"/></svg><span data-t="hero.whats"></span>
    </a>
  </dialog>

  <main id="conteudo">
    <!-- ============================================================== HERO -->
    <section class="hero" id="topo">
      <canvas class="hero__sparkles" aria-hidden="true"></canvas>
      <div class="hero__glow" aria-hidden="true"></div>

      <div class="hero__in">
        <div class="medal" aria-hidden="true">
          <svg class="medal__ring" viewBox="0 0 400 400">
            <defs><path id="ringPath" d="M200 200m-178 0a178 178 0 1 1 356 0a178 178 0 1 1-356 0"/></defs>
            <circle cx="200" cy="200" r="196" fill="none" stroke="url(#gStroke)" stroke-width=".8" opacity=".55"/>
            <circle cx="200" cy="200" r="160" fill="none" stroke="url(#gStroke)" stroke-width=".8" opacity=".35"/>
            <text><textPath href="#ringPath" textLength="1110" lengthAdjust="spacing" data-ring></textPath></text>
          </svg>
          <span class="medal__halo"></span>
          <span class="medal__disc">
            <img class="medal__logo" src="assets/img/logo.webp" alt="" width="720" height="720" fetchpriority="high">
            <span class="medal__shine"></span>
          </span>
        </div>

        <p class="eyebrow hero__eyebrow"><svg aria-hidden="true"><use href="#i-spark"/></svg><span data-t="hero.eyebrow"></span><svg aria-hidden="true"><use href="#i-spark"/></svg></p>
        <h1 class="hero__title" data-t-html="hero.title"></h1>
        <svg class="swoosh" viewBox="0 0 600 60" preserveAspectRatio="none" aria-hidden="true">
          <path pathLength="1" d="M8 44C120 10 220 6 300 26s190 34 292-8" fill="none" stroke="url(#gStroke)" stroke-width="2.4" stroke-linecap="round"/>
          <path pathLength="1" d="M60 50c110-22 200-20 280-6s150 14 220-8" fill="none" stroke="url(#gStroke)" stroke-width="1" stroke-linecap="round" opacity=".6"/>
        </svg>
        <p class="hero__lead" data-t="hero.lead"></p>
        <div class="hero__ctas">
          <a class="btn btn--gold" href="#vitrine"><span data-t="hero.cta"></span><svg aria-hidden="true"><use href="#i-arrow"/></svg></a>
          <a class="btn btn--ghost" data-wa href="#" target="_blank" rel="noopener"><svg aria-hidden="true"><use href="#i-wa"/></svg><span data-t="hero.whats"></span></a>
        </div>
      </div>

      <a class="scroll-cue" href="#vitrine" aria-hidden="true" tabindex="-1"><span data-t="hero.scroll"></span><i></i></a>
    </section>

    <!-- ============================================================ LINHAS -->
    <div class="marquee" aria-hidden="true">
      <div class="marquee__track" data-marquee></div>
    </div>

    <!-- ========================================================= PROMESSAS -->
    <section class="promise" aria-label="Por que comprar aqui">
      <ul class="promise__list stagger" data-promise></ul>
    </section>

    <!-- =========================================================== VITRINE -->
    <section class="shop" id="vitrine">
      <header class="sec-head reveal">
        <p class="eyebrow"><svg aria-hidden="true"><use href="#i-spark"/></svg><span data-t="shop.eyebrow"></span><svg aria-hidden="true"><use href="#i-spark"/></svg></p>
        <h2 class="sec-title" data-t-html="shop.title"></h2>
        <p class="sec-lead" data-t="shop.lead"></p>
      </header>

      <div class="shop__tools reveal">
        <div class="chips-wrap">
          <div class="chips" data-chips></div>
        </div>
        <label class="search">
          <svg aria-hidden="true"><use href="#i-search"/></svg>
          <span class="sr-only" data-t="shop.search"></span>
          <input type="search" data-search autocomplete="off" enterkeyhint="search">
          <button class="search__clear" type="button" data-search-clear hidden>
            <svg aria-hidden="true"><use href="#i-close"/></svg><span class="sr-only" data-t="shop.clear"></span>
          </button>
        </label>
      </div>

      <p class="shop__count" data-count aria-live="polite"></p>
      <ul class="grid" data-grid></ul>

      <div class="shop__empty" data-empty hidden>
        <p data-t="shop.empty"></p>
        <a class="btn btn--ghost" data-wa href="#" target="_blank" rel="noopener"><svg aria-hidden="true"><use href="#i-wa"/></svg><span data-t="shop.emptyAsk"></span></a>
      </div>
      <div class="shop__more">
        <button class="btn btn--line" type="button" data-more hidden><span data-t="shop.more"></span><svg aria-hidden="true"><use href="#i-down"/></svg></button>
      </div>
    </section>

    <!-- ======================================================= MAIS AMADOS -->
    <section class="loved" id="amados">
      <header class="sec-head reveal">
        <p class="eyebrow"><svg aria-hidden="true"><use href="#i-spark"/></svg><span data-t="loved.eyebrow"></span><svg aria-hidden="true"><use href="#i-spark"/></svg></p>
        <h2 class="sec-title" data-t-html="loved.title"></h2>
      </header>

      <div class="spot reveal" data-spot aria-roledescription="carousel">
        <p class="spot__bigword" data-spot-word aria-hidden="true"></p>
        <div class="spot__stage">
          <span class="spot__rays" aria-hidden="true"></span>
          <span class="spot__halo" aria-hidden="true"></span>
          <button class="spot__art" type="button" data-spot-art></button>
          <span class="spot__pedestal" aria-hidden="true"></span>
        </div>
        <div class="spot__info" data-spot-info aria-live="polite"></div>
        <div class="spot__nav">
          <button class="icon-btn icon-btn--ring" type="button" data-spot-prev><svg aria-hidden="true"><use href="#i-chev-l"/></svg><span class="sr-only" data-t="loved.prev"></span></button>
          <div class="spot__dots" data-spot-dots></div>
          <button class="icon-btn icon-btn--ring" type="button" data-spot-pause><svg aria-hidden="true"><use href="#i-pause"/></svg><span class="sr-only" data-t="loved.pause"></span></button>
          <button class="icon-btn icon-btn--ring" type="button" data-spot-next><svg aria-hidden="true"><use href="#i-chev-r"/></svg><span class="sr-only" data-t="loved.next"></span></button>
        </div>
      </div>
    </section>

    <!-- ====================================================== COMO COMPRAR -->
    <section class="how" id="como">
      <header class="sec-head reveal">
        <p class="eyebrow"><svg aria-hidden="true"><use href="#i-spark"/></svg><span data-t="how.eyebrow"></span><svg aria-hidden="true"><use href="#i-spark"/></svg></p>
        <h2 class="sec-title" data-t-html="how.title"></h2>
      </header>
      <ol class="steps stagger" data-steps>
        <li class="steps__line" aria-hidden="true"><i></i></li>
      </ol>
    </section>

    <!-- ============================================================= SOBRE -->
    <section class="about" id="sobre">
      <div class="about__in reveal">
        <span class="about__medal" aria-hidden="true">
          <img src="assets/img/logo-360.webp" alt="" width="360" height="360" loading="lazy">
        </span>
        <p class="eyebrow"><svg aria-hidden="true"><use href="#i-spark"/></svg><span data-t="about.eyebrow"></span><svg aria-hidden="true"><use href="#i-spark"/></svg></p>
        <h2 class="sec-title" data-t-html="about.title"></h2>
        <div class="about__text" data-about></div>
        <p class="about__sign"><span data-t="about.sign"></span><b data-brand>Amarabotibeauty</b></p>
      </div>
    </section>

    <!-- ============================================================ DÚVIDAS -->
    <section class="faq" id="duvidas">
      <header class="sec-head reveal">
        <p class="eyebrow"><svg aria-hidden="true"><use href="#i-spark"/></svg><span data-t="faq.eyebrow"></span><svg aria-hidden="true"><use href="#i-spark"/></svg></p>
        <h2 class="sec-title" data-t-html="faq.title"></h2>
      </header>
      <div class="faq__list stagger" data-faq></div>
    </section>

    <!-- ========================================================= CHAMADA -->
    <section class="final" id="contato">
      <div class="final__in reveal">
        <h2 class="sec-title final__title" data-t-html="final.title"></h2>
        <p class="sec-lead" data-t="final.text"></p>
        <a class="btn btn--gold btn--lg" data-wa href="#" target="_blank" rel="noopener"><svg aria-hidden="true"><use href="#i-wa"/></svg><span data-t="final.cta"></span></a>
        <p class="final__phone" data-wa-label></p>
      </div>
    </section>
  </main>

  <footer class="foot">
    <a class="wordmark wordmark--lg" href="#topo" data-brand>Amarabotibeauty</a>
    <nav class="foot__nav" aria-label="Rodapé">
      <a href="#vitrine" data-t="nav.shop"></a>
      <a href="#amados" data-t="nav.loved"></a>
      <a href="#como" data-t="nav.how"></a>
      <a href="#duvidas" data-t="nav.faq"></a>
    </nav>
    <div class="foot__social">
      <a class="icon-btn icon-btn--ring" data-wa href="#" target="_blank" rel="noopener"><svg aria-hidden="true"><use href="#i-wa"/></svg><span class="sr-only">WhatsApp</span></a>
      <a class="icon-btn icon-btn--ring" data-ig href="#" target="_blank" rel="noopener" hidden><svg aria-hidden="true"><use href="#i-ig"/></svg><span class="sr-only">Instagram</span></a>
    </div>
    <p class="foot__small" data-t="footer.disclaimer"></p>
    <p class="foot__small">© <span data-year></span> <span data-brand>Amarabotibeauty</span>. <span data-t="footer.rights"></span></p>
  </footer>

  <!-- Botão do WhatsApp (computador) e barra fixa (celular) -->
  <a class="fab-wa" data-wa href="#" target="_blank" rel="noopener">
    <svg aria-hidden="true"><use href="#i-wa"/></svg><span class="sr-only">WhatsApp</span>
  </a>
  <div class="dock" data-dock>
    <a class="dock__wa" data-wa href="#" target="_blank" rel="noopener"><svg aria-hidden="true"><use href="#i-wa"/></svg><span class="sr-only">WhatsApp</span></a>
    <button class="dock__cart" type="button" data-cart-open>
      <svg aria-hidden="true"><use href="#i-bag"/></svg>
      <span data-dock-label></span>
      <b data-dock-total></b>
    </button>
  </div>

  <!-- ========================================================== SACOLA -->
  <dialog class="drawer" id="cart" aria-labelledby="cart-title">
    <div class="drawer__panel">
      <header class="drawer__head">
        <h2 id="cart-title" class="drawer__title" data-t="cart.title"></h2>
        <span class="drawer__n" data-cart-items></span>
        <button class="icon-btn" type="button" data-close>
          <svg aria-hidden="true"><use href="#i-close"/></svg><span class="sr-only" data-t="ui.close"></span>
        </button>
      </header>

      <div class="drawer__body">
        <div class="drawer__empty" data-cart-empty>
          <svg aria-hidden="true"><use href="#i-bag"/></svg>
          <p data-t="cart.empty"></p>
          <button class="btn btn--line" type="button" data-close data-goto-shop><span data-t="cart.emptyCta"></span></button>
        </div>
        <ul class="lines" data-cart-lines></ul>

        <form class="order" data-order novalidate>
          <label class="field">
            <span data-t="cart.name"></span>
            <input name="name" autocomplete="name" required data-ph="cart.namePh">
          </label>
          <fieldset class="field">
            <legend data-t="cart.delivery"></legend>
            <div class="seg">
              <label><input type="radio" name="delivery" value="pickup" checked><span data-t="cart.pickup"></span></label>
              <label><input type="radio" name="delivery" value="ship"><span data-t="cart.ship"></span></label>
            </div>
          </fieldset>
          <label class="field" data-city hidden>
            <span data-t="cart.city"></span>
            <input name="city" autocomplete="address-level2" data-ph="cart.cityPh">
          </label>
          <label class="field">
            <span data-t="cart.notes"></span>
            <textarea name="notes" rows="2" data-ph="cart.notesPh"></textarea>
          </label>
        </form>
      </div>

      <footer class="drawer__foot" data-cart-foot>
        <p class="drawer__total"><span data-t="cart.subtotal"></span><b data-cart-total></b></p>
        <p class="drawer__err" data-order-err role="alert" hidden></p>
        <button class="btn btn--gold btn--block" type="button" data-send>
          <svg aria-hidden="true"><use href="#i-wa"/></svg><span data-t="cart.send"></span>
        </button>
        <p class="drawer__note" data-t="cart.note"></p>
      </footer>
    </div>
  </dialog>

  <!-- ===================================================== DETALHES -->
  <dialog class="quick" id="quick" aria-labelledby="quick-name">
    <div class="quick__panel" data-quick></div>
  </dialog>

  <div class="toast" role="status" aria-live="polite" data-toast></div>

  <noscript><p class="noscript">Ative o JavaScript para ver os produtos. · Attiva JavaScript per vedere i prodotti.</p></noscript>

  <script src="assets/js/content.js"></script>
  <script src="assets/js/products.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
