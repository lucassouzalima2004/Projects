<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bossa Nail Studio · Manicure e pedicure brasileira</title>
  <meta name="description" content="Manicure e pedicure com técnica brasileira na Austrália. Esmaltação em gel, alongamento em fibra e em gel, spa dos pés. Agende pelo WhatsApp.">
  <meta name="theme-color" content="#FBF8F7">

  <!-- Prévia do link no WhatsApp/Instagram/Facebook. O WhatsApp só mostra a imagem com o endereço completo:
       o deploy do Cloudflare (.github/workflows/deploy-cloudflare.yml) troca o og:image sozinho.
       Em outra hospedagem, troque por https://seudominio.com/assets/img/og-image.jpg -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Bossa Nail Studio">
  <meta property="og:title" content="Bossa Nail Studio · Manicure e pedicure brasileira">
  <meta property="og:description" content="Cutícula perfeita, brilho que dura. Monte seu horário e agende pelo WhatsApp.">
  <meta property="og:image" content="assets/img/og-image.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:locale" content="pt_BR">
  <meta property="og:locale:alternate" content="en_AU">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400..700&family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..700&display=swap">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <a class="skip-link" href="#conteudo" data-t="ui.skip"></a>

  <!-- Gradientes e ícones compartilhados -->
  <svg class="sr-defs" width="0" height="0" aria-hidden="true" focusable="false">
    <defs>
      <linearGradient id="tipShade" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#000" stop-opacity=".22"/>
        <stop offset=".2" stop-color="#000" stop-opacity="0"/>
        <stop offset=".78" stop-color="#000" stop-opacity="0"/>
        <stop offset="1" stop-color="#000" stop-opacity=".26"/>
      </linearGradient>
      <linearGradient id="tipGloss" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#fff" stop-opacity="0"/>
        <stop offset=".18" stop-color="#fff" stop-opacity=".75"/>
        <stop offset=".62" stop-color="#fff" stop-opacity=".28"/>
        <stop offset="1" stop-color="#fff" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="tipShine" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#fff" stop-opacity="0"/>
        <stop offset=".5" stop-color="#fff" stop-opacity=".55"/>
        <stop offset="1" stop-color="#fff" stop-opacity="0"/>
      </linearGradient>
    </defs>
    <symbol id="i-wa" viewBox="0 0 24 24"><path fill="currentColor" d="M17.47 14.38c-.3-.15-1.76-.87-2.03-.97-.27-.1-.47-.15-.67.15-.2.3-.77.97-.94 1.16-.17.2-.35.22-.64.07-.3-.15-1.26-.46-2.39-1.47-.88-.79-1.48-1.76-1.65-2.06-.17-.3-.02-.46.13-.6.13-.14.3-.35.45-.52.15-.18.2-.3.3-.5.1-.2.05-.37-.03-.52-.07-.15-.67-1.6-.91-2.2-.24-.58-.49-.5-.67-.51h-.57c-.2 0-.52.07-.79.37-.27.3-1.04 1.02-1.04 2.48s1.06 2.88 1.21 3.07c.15.2 2.1 3.2 5.08 4.49.71.3 1.26.49 1.7.63.71.22 1.36.19 1.87.12.57-.09 1.76-.72 2-1.41.25-.7.25-1.29.18-1.41-.08-.13-.28-.2-.57-.35zM12.05 21.8h-.01a9.9 9.9 0 0 1-5.03-1.38l-.36-.21-3.74.98 1-3.65-.24-.37a9.86 9.86 0 0 1-1.51-5.26c0-5.45 4.44-9.88 9.89-9.88a9.83 9.83 0 0 1 6.99 2.9 9.83 9.83 0 0 1 2.89 6.99c0 5.45-4.44 9.88-9.88 9.88zm8.41-18.3A11.82 11.82 0 0 0 12.05 0C5.5 0 .16 5.34.16 11.89c0 2.1.55 4.14 1.59 5.95L.06 24l6.3-1.65a11.88 11.88 0 0 0 5.68 1.45h.01c6.55 0 11.89-5.34 11.89-11.9 0-3.17-1.24-6.16-3.48-8.4z"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" d="M4 12h15M13 6l6 6-6 6"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" d="M6 6l12 12M18 6 6 18"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" d="M4 8h16M4 16h16"/></symbol>
    <symbol id="i-ig" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4.2"/></g><circle cx="17.4" cy="6.6" r="1.1" fill="currentColor"/></symbol>
    <symbol id="i-spark" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2.5c.5 4.6 2.4 6.9 7 7.5-4.6.6-6.5 2.9-7 7.5-.5-4.6-2.4-6.9-7-7.5 4.6-.6 6.5-2.9 7-7.5z"/></symbol>
  </svg>

  <header class="site-header" id="topo">
    <div class="container header-inner">
      <a class="logo" href="#topo" aria-label="Bossa Nail Studio">
        <span class="logo__mark" aria-hidden="true"></span>
        <span class="logo__name" data-brand-name>Bossa</span>
        <span class="logo__tag" data-brand-tag>Nail Studio</span>
      </a>

      <nav class="nav" id="nav" aria-label="Principal">
        <a href="#servicos" data-t="nav.services"></a>
        <a href="#monte" data-t="nav.design"></a>
        <a href="#sobre" data-t="nav.about"></a>
        <a href="#duvidas" data-t="nav.faq"></a>
      </nav>

      <div class="header-actions">
        <div class="lang" role="group" data-t-attr="aria-label:ui.language">
          <button type="button" data-lang="pt" aria-pressed="true">PT</button>
          <button type="button" data-lang="en" aria-pressed="false">EN</button>
        </div>
        <a class="btn btn--primary btn--sm header-cta" href="#servicos" data-t="nav.book"></a>
        <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="nav" data-t-attr="aria-label:ui.menu">
          <svg aria-hidden="true"><use href="#i-menu"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main id="conteudo">
    <!-- HERO -------------------------------------------------------------- -->
    <section class="hero" aria-labelledby="hero-title">
      <div class="container hero__grid">
        <div class="hero__copy">
          <p class="eyebrow" data-t="hero.eyebrow"></p>
          <h1 id="hero-title" class="hero__title" data-t="hero.title"></h1>
          <p class="hero__lead" data-t="hero.lead"></p>
          <div class="hero__ctas">
            <a class="btn btn--primary" href="#servicos"><span data-t="hero.primary"></span><svg class="btn__icon btn__icon--arrow" aria-hidden="true"><use href="#i-arrow"/></svg></a>
            <a class="btn btn--ghost" data-wa href="#" target="_blank" rel="noopener"><svg class="btn__icon" aria-hidden="true"><use href="#i-wa"/></svg><span data-t="hero.secondary"></span></a>
          </div>
        </div>

        <figure class="fan" id="fan">
          <div class="fan__stage" role="group" data-t-attr="aria-label:hero.fanLabel">
            <div class="fan__glow" aria-hidden="true"></div>
            <div class="fan__tips" id="fan-tips"></div>
            <span class="fan__ring" aria-hidden="true"></span>
          </div>
          <figcaption class="fan__caption" aria-live="polite">
            <span class="fan__code" id="fan-code"></span>
            <span class="fan__name" id="fan-name"></span>
            <span class="fan__desc" id="fan-desc"></span>
            <span class="fan__hint" data-t="hero.fanHint"></span>
          </figcaption>
        </figure>
      </div>
    </section>

    <div class="trust">
      <ul class="container trust__list" id="trust" role="list" data-stagger></ul>
    </div>

    <!-- SERVIÇOS ----------------------------------------------------------- -->
    <section class="services on-dark" id="servicos" aria-labelledby="services-title">
      <div class="container">
        <header class="section-head" data-stagger>
          <div>
            <p class="eyebrow" data-t="services.eyebrow"></p>
            <h2 id="services-title" data-t="services.title"></h2>
          </div>
          <p class="section-head__lead" data-t="services.lead"></p>
        </header>

        <div class="services__grid">
          <article class="menu-card" aria-labelledby="menu-title" data-reveal="card">
            <header class="menu-card__head">
              <p class="menu-card__brand"><span data-brand-name>Bossa</span></p>
              <p class="menu-card__tag" data-brand-tag>Nail Studio</p>
              <h3 class="menu-card__title" id="menu-title" data-t="services.cardTitle"></h3>
            </header>
            <div class="menu" id="menu"></div>
            <p class="menu-card__note" data-t="services.cardNote"></p>
          </article>

          <aside class="summary is-empty" id="summary" aria-labelledby="summary-title" data-reveal style="--rd: .15s">
            <div class="summary__head">
              <h3 id="summary-title" data-t="summary.title"></h3>
              <span class="summary__count" id="sum-count"></span>
            </div>

            <ul class="summary__list" id="sum-list" role="list" aria-live="polite"></ul>

            <dl class="summary__totals">
              <div><dt data-t="summary.time"></dt><dd id="sum-time">0 min</dd></div>
              <div><dt data-t="summary.total"></dt><dd class="summary__total" id="sum-total">$0</dd></div>
            </dl>

            <div class="summary__inspo" id="sum-inspo" hidden>
              <svg class="summary__inspo-icon" aria-hidden="true"><use href="#i-spark"/></svg>
              <div>
                <span class="summary__label" data-t="summary.inspiration"></span>
                <span id="sum-inspo-text"></span>
              </div>
              <button type="button" class="icon-btn" id="sum-inspo-remove" data-t-attr="aria-label:summary.remove"><svg aria-hidden="true"><use href="#i-close"/></svg></button>
            </div>

            <form class="summary__form" id="sum-form" novalidate>
              <div class="field">
                <label for="f-name" data-t="summary.name"></label>
                <input id="f-name" name="name" type="text" autocomplete="given-name" data-t-attr="placeholder:summary.namePh">
              </div>
              <div class="field-row">
                <div class="field">
                  <label for="f-date" data-t="summary.date"></label>
                  <input id="f-date" name="date" type="date">
                </div>
                <fieldset class="field">
                  <legend data-t="summary.period"></legend>
                  <div class="periods" id="periods"></div>
                </fieldset>
              </div>
              <div class="field">
                <label for="f-notes" data-t="summary.notes"></label>
                <textarea id="f-notes" name="notes" rows="2" data-t-attr="placeholder:summary.notesPh"></textarea>
              </div>
            </form>

            <a class="btn btn--light btn--block" id="sum-send" data-wa href="#" target="_blank" rel="noopener">
              <svg class="btn__icon" aria-hidden="true"><use href="#i-wa"/></svg><span id="sum-send-label"></span>
            </a>
            <div class="summary__foot">
              <p class="summary__fine" data-t="summary.fine"></p>
              <button type="button" class="link-btn" id="sum-clear" data-t="summary.clear"></button>
            </div>
          </aside>
        </div>
      </div>
    </section>

    <!-- MONTE SUA UNHA ---------------------------------------------------- -->
    <section class="designer" id="monte" aria-labelledby="design-title">
      <div class="container">
        <header class="section-head" data-stagger>
          <div>
            <p class="eyebrow" data-t="design.eyebrow"></p>
            <h2 id="design-title" data-t="design.title"></h2>
          </div>
          <p class="section-head__lead" data-t="design.lead"></p>
        </header>

        <div class="designer__grid">
          <figure class="stage" data-reveal="zoom">
            <div class="stage__art" id="hand"></div>
            <figcaption class="stage__caption">
              <span class="stage__combo" id="design-combo"></span>
              <span class="stage__desc" id="design-desc"></span>
            </figcaption>
          </figure>

          <form class="controls" id="design-form" novalidate data-stagger>
            <fieldset class="opt-group">
              <legend><span data-t="design.shape"></span></legend>
              <div class="shape-opts" id="opt-shape"></div>
            </fieldset>
            <fieldset class="opt-group">
              <legend><span data-t="design.color"></span> <span class="opt-group__value" id="opt-color-name"></span></legend>
              <div class="color-opts" id="opt-color"></div>
            </fieldset>
            <fieldset class="opt-group">
              <legend><span data-t="design.finish"></span></legend>
              <div class="finish-opts" id="opt-finish"></div>
            </fieldset>
            <fieldset class="opt-group">
              <legend><span data-t="design.skin"></span></legend>
              <div class="skin-opts" id="opt-skin"></div>
            </fieldset>
            <div class="controls__actions">
              <button type="button" class="btn btn--primary" id="design-use"><svg class="btn__icon" aria-hidden="true"><use href="#i-plus"/></svg><span data-t="design.use"></span></button>
              <button type="button" class="btn btn--ghost" id="design-random"><svg class="btn__icon" aria-hidden="true"><use href="#i-spark"/></svg><span data-t="design.surprise"></span></button>
            </div>
            <p class="controls__status" id="design-status" role="status"></p>
            <p class="controls__note" data-t="design.note"></p>
          </form>
        </div>
      </div>
    </section>

    <!-- GALERIA (aparece só quando houver fotos em content.js) ------------- -->
    <section class="gallery" id="galeria" aria-labelledby="gallery-title" hidden>
      <div class="container">
        <header class="section-head" data-stagger>
          <div>
            <p class="eyebrow" data-t="gallery.eyebrow"></p>
            <h2 id="gallery-title" data-t="gallery.title"></h2>
          </div>
        </header>
        <ul class="gallery__grid" id="gallery-grid" role="list" data-stagger></ul>
      </div>
    </section>

    <!-- SOBRE --------------------------------------------------------------- -->
    <section class="about" id="sobre" aria-labelledby="about-title">
      <div class="container about__grid">
        <figure class="arch" id="about-visual" data-reveal="zoom"></figure>
        <div class="about__copy" data-stagger>
          <p class="eyebrow" data-t="about.eyebrow"></p>
          <h2 id="about-title" data-t="about.title"></h2>
          <p class="about__lead" data-t="about.p1"></p>
          <p data-t="about.p2"></p>
          <h3 class="about__subtitle" data-t="about.hygieneTitle"></h3>
          <ul class="hygiene" id="hygiene" role="list"></ul>
        </div>
      </div>
    </section>

    <!-- COMO AGENDAR -------------------------------------------------------- -->
    <section class="steps" id="como-agendar" aria-labelledby="steps-title">
      <div class="container">
        <header class="section-head" data-stagger>
          <div>
            <p class="eyebrow" data-t="steps.eyebrow"></p>
            <h2 id="steps-title" data-t="steps.title"></h2>
          </div>
        </header>
        <ol class="steps__list" id="steps" role="list" data-stagger></ol>
      </div>
    </section>

    <!-- DÚVIDAS ------------------------------------------------------------- -->
    <section class="faq" id="duvidas" aria-labelledby="faq-title">
      <div class="container faq__grid">
        <header class="faq__head" data-stagger>
          <p class="eyebrow" data-t="faq.eyebrow"></p>
          <h2 id="faq-title" data-t="faq.title"></h2>
        </header>
        <div class="faq__list" id="faq" data-stagger></div>
      </div>
    </section>

    <!-- CONTATO ------------------------------------------------------------- -->
    <section class="contact on-accent" id="contato" aria-labelledby="contact-title">
      <div class="container contact__inner" data-stagger>
        <p class="eyebrow" data-t="contact.eyebrow"></p>
        <h2 id="contact-title" data-t="contact.title"></h2>
        <p class="contact__lead" data-t="contact.lead"></p>
        <a class="btn btn--milk" data-wa href="#" target="_blank" rel="noopener"><svg class="btn__icon" aria-hidden="true"><use href="#i-wa"/></svg><span data-t="contact.cta"></span></a>
        <dl class="contact__details" id="contact-details"></dl>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <a class="logo logo--footer" href="#topo">
        <span class="logo__mark" aria-hidden="true"></span>
        <span class="logo__name" data-brand-name>Bossa</span>
        <span class="logo__tag" data-brand-tag>Nail Studio</span>
      </a>
      <p class="footer__legal">© <span id="year"></span> <span data-brand-full>Bossa Nail Studio</span>. <span data-t="footer.rights"></span></p>
      <div class="footer__actions">
        <div class="lang lang--dark" role="group" data-t-attr="aria-label:ui.language">
          <button type="button" data-lang="pt" aria-pressed="true">PT</button>
          <button type="button" data-lang="en" aria-pressed="false">EN</button>
        </div>
        <a class="link-btn" href="#topo" data-t="footer.top"></a>
      </div>
    </div>
  </footer>

  <!-- Barra fixa no celular -->
  <div class="mbar" id="mbar" aria-hidden="true">
    <a class="btn btn--light btn--block mbar__wa" data-wa href="#" target="_blank" rel="noopener" tabindex="-1"><svg class="btn__icon" aria-hidden="true"><use href="#i-wa"/></svg><span data-t="bar.empty"></span></a>
    <div class="mbar__summary">
      <span class="mbar__text" id="mbar-text"></span>
      <a class="btn btn--light btn--sm" href="#summary" id="mbar-view" tabindex="-1"><span data-t="bar.view"></span><svg class="btn__icon btn__icon--arrow" aria-hidden="true"><use href="#i-arrow"/></svg></a>
    </div>
  </div>

  <noscript>
    <p class="noscript">Ative o JavaScript para ver os serviços e agendar. · Please enable JavaScript to see services and book.</p>
  </noscript>

  <script src="assets/js/content.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
