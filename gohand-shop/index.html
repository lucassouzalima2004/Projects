    <div class="container header-inner">
      <a class="brand" href="#topo" aria-label="GoHand Shop">
        <svg class="logo" viewBox="0 0 866 270" aria-hidden="true"><use href="#logo"/></svg>
      </a>

      <nav class="nav" id="nav" aria-label="Main">
        <a href="#servicos" data-t="nav.services">Services</a>
        <a href="#como-funciona" data-t="nav.how">How it works</a>
        <a href="#orcamento" data-t="nav.quote">Get a quote</a>
        <a href="#onde" data-t="nav.area" data-needs-areas>Coverage</a>
        <a href="#duvidas" data-t="nav.faq">FAQ</a>
        <a class="btn btn--orange nav__cta" data-wa href="#" target="_blank" rel="noopener">
          <svg class="icon" aria-hidden="true"><use href="#i-wa"/></svg>
          <span data-t="hero.whatsapp">Chat on WhatsApp</span>
        </a>
      </nav>

      <div class="header-actions">
        <div class="lang" role="group" data-t-attr="aria-label:ui.lang">
          <button type="button" data-lang="en" aria-pressed="true">EN</button>
          <button type="button" data-lang="pt" aria-pressed="false">PT</button>
        </div>
        <a class="btn btn--sm btn--light header-wa" data-wa href="#" target="_blank" rel="noopener">
          <svg class="icon" aria-hidden="true"><use href="#i-wa"/></svg>
          <span data-t="ui.whatsapp">WhatsApp</span>
        </a>
        <button class="menu-btn" type="button" aria-expanded="false" aria-controls="nav" data-t-attr="aria-label:ui.menu">
          <svg class="icon icon--menu" aria-hidden="true"><use href="#i-menu"/></svg>
          <svg class="icon icon--close" aria-hidden="true"><use href="#i-close"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main id="conteudo">
    <!-- ===================================================== HERO -->
    <section class="hero" aria-labelledby="hero-title">
      <div class="hero__bg" aria-hidden="true">
        <span class="hero__stripes"></span>
        <span class="hero__word">gohand</span>
      </div>

      <div class="container hero__grid">
        <div class="hero__copy">
          <p class="kicker kicker--light" data-t="hero.kicker"></p>
          <h1 class="hero__title" id="hero-title" data-t-rich="hero.title"></h1>
          <p class="hero__lead" data-t="hero.lead"></p>
          <div class="hero__ctas">
            <a class="btn btn--light btn--lg" data-wa href="#" target="_blank" rel="noopener">
              <svg class="icon" aria-hidden="true"><use href="#i-wa"/></svg>
              <span data-t="hero.whatsapp"></span>
            </a>
            <a class="btn btn--ghost btn--lg" data-tel href="#">
              <svg class="icon" aria-hidden="true"><use href="#i-phone"/></svg>
              <span data-t="hero.call"></span>
            </a>
          </div>
          <p class="hero__note">
            <svg class="icon" aria-hidden="true"><use href="#i-check"/></svg>
            <span data-t="hero.note"></span>
          </p>
        </div>

        <div class="hero__visual" aria-hidden="true">
          <svg class="route" viewBox="0 0 520 200">
            <path class="route__path" id="route-path" d="M28 150 C 70 60, 150 40, 210 80 S 320 110, 370 70 S 450 22, 492 46"/>
            <path class="route__dash" pathLength="1" d="M28 150 C 70 60, 150 40, 210 80 S 320 110, 370 70 S 450 22, 492 46"/>
            <g class="route__start">
              <circle cx="28" cy="150" r="15"/>
              <circle cx="28" cy="150" r="5.5"/>
            </g>
            <g class="route__end" transform="translate(492 46)">
              <path d="M0 0C-5-7-15-15-15-27a15 15 0 0 1 30 0c0 12-10 20-15 27z"/>
              <circle cy="-27" r="5.5"/>
            </g>
            <g class="route__mover" id="route-mover" transform="translate(28 150)">
              <g class="route__box">
                <rect x="-15" y="-15" width="30" height="30" rx="5"/>
                <path d="M-15 -4h30M0 -15v11"/>
              </g>
            </g>
          </svg>

          <article class="label" id="hero-label">
            <header class="label__head">
              <svg class="logo logo--label" viewBox="0 0 866 270"><use href="#logo"/></svg>
              <span class="label__priority" data-t="label.priority"></span>
            </header>
            <div class="label__row label__row--tracking">
              <span class="label__key" data-t="label.tracking"></span>
              <span class="label__val label__val--mono" id="label-code">GH-0000-0000</span>
            </div>
            <div class="label__cols">
              <div class="label__row">
                <span class="label__key" data-t="label.from"></span>
                <span class="label__val" data-t="label.fromValue"></span>
              </div>
              <div class="label__row">
                <span class="label__key" data-t="label.to"></span>
                <span class="label__val" data-t="label.toValue"></span>
              </div>
            </div>
            <ol class="label__steps" id="label-steps"></ol>
            <div class="label__barcode" id="label-barcode"></div>
            <div class="label__stamp"><span data-t="label.stamp"></span></div>
          </article>
        </div>
      </div>
    </section>

    <!-- ===================================================== FAIXA -->
    <div class="ticker" aria-hidden="true">
      <div class="ticker__track" id="ticker"></div>
    </div>

    <!-- ===================================================== SERVIÇOS -->
    <section class="section services" id="servicos" aria-labelledby="services-title">
      <div class="container">
        <div class="section-head" data-reveal>
          <p class="kicker" data-t="services.kicker"></p>
          <h2 class="title" id="services-title" data-t-rich="services.title"></h2>
          <p class="lead" data-t="services.lead"></p>
        </div>
        <ul class="services__grid" id="services-list"></ul>
      </div>
    </section>

    <!-- ===================================================== DIFERENCIAIS -->
    <section class="section why" id="por-que" aria-labelledby="why-title">
      <div class="why__word" aria-hidden="true">go</div>
      <div class="container why__grid">
        <div class="section-head" data-reveal>
          <p class="kicker" data-t="why.kicker"></p>
          <h2 class="title" id="why-title" data-t-rich="why.title"></h2>
          <p class="lead" data-t="why.lead"></p>
        </div>
        <ul class="why__list" id="promises-list"></ul>
      </div>
    </section>

    <!-- ===================================================== COMO FUNCIONA -->
    <section class="section how" id="como-funciona" aria-labelledby="how-title">
      <div class="container">
        <div class="section-head section-head--center" data-reveal>
          <p class="kicker" data-t="how.kicker"></p>
          <h2 class="title" id="how-title" data-t-rich="how.title"></h2>
        </div>
        <div class="track" id="track">
          <div class="track__rail" aria-hidden="true"><span class="track__fill"></span></div>
          <ol class="track__steps" id="steps-list"></ol>
        </div>
      </div>
    </section>

    <!-- ===================================================== ORÇAMENTO -->
    <section class="section quote" id="orcamento" aria-labelledby="quote-title">
      <div class="quote__stripes" aria-hidden="true"></div>
      <div class="container quote__grid">
        <div class="quote__intro" data-reveal>
          <p class="kicker kicker--light" data-t="quote.kicker"></p>
          <h2 class="title title--on-orange" id="quote-title" data-t-rich="quote.title"></h2>
          <p class="lead lead--on-orange" data-t="quote.lead"></p>
          <ul class="quote__perks" id="quote-perks"></ul>
        </div>

        <div class="ship" data-reveal>
          <div class="ship__head">
            <svg class="logo logo--ship" viewBox="0 0 866 270" aria-hidden="true"><use href="#logo"/></svg>
            <span class="ship__title" data-t="quote.header"></span>
            <span class="ship__code" id="quote-code" aria-hidden="true">Q-0000</span>
          </div>

          <!-- Formulário do CRM (crmForm no content.js). Sem ele, aparece a etiqueta abaixo, que envia pelo WhatsApp. -->
          <div class="ship__crm" id="crm-form" hidden></div>
          <div class="ship__alt" id="crm-alt" hidden>
            <span data-t="quote.altLabel"></span>
            <a class="btn btn--orange btn--sm" data-wa href="#" target="_blank" rel="noopener">
              <svg class="icon" aria-hidden="true"><use href="#i-wa"/></svg>
              <span data-t="ui.whatsapp"></span>
            </a>
            <a class="btn btn--outline btn--sm" data-tel href="#">
              <svg class="icon" aria-hidden="true"><use href="#i-phone"/></svg>
              <span data-t="ui.call"></span>
            </a>
          </div>

          <form class="ship__form" id="quote-form" novalidate>

          <div class="ship__row ship__row--2">
            <label class="cell">
              <span class="cell__label" data-t="quote.name"></span>
              <input name="name" type="text" autocomplete="name" required data-t-attr="placeholder:quote.namePh">
            </label>
            <label class="cell">
              <span class="cell__label" data-t="quote.company"></span>
              <input name="company" type="text" autocomplete="organization" data-t-attr="placeholder:quote.companyPh">
            </label>
          </div>

          <div class="ship__row ship__row--2 ship__row--route">
            <label class="cell">
              <span class="cell__label"><span class="cell__dot cell__dot--a" aria-hidden="true">A</span> <span data-t="quote.pickup"></span></span>
              <input name="pickup" type="text" autocomplete="address-level2" data-t-attr="placeholder:quote.pickupPh">
            </label>
            <label class="cell">
              <span class="cell__label"><span class="cell__dot cell__dot--b" aria-hidden="true">B</span> <span data-t="quote.dropoff"></span></span>
              <input name="dropoff" type="text" data-t-attr="placeholder:quote.dropoffPh">
            </label>
          </div>

          <fieldset class="cell cell--chips">
            <legend class="cell__label" data-t="quote.kind"></legend>
            <div class="chips" id="chips-kind"></div>
          </fieldset>

          <div class="ship__row ship__row--2">
            <fieldset class="cell cell--chips">
              <legend class="cell__label" data-t="quote.frequency"></legend>
              <div class="chips" id="chips-frequency"></div>
            </fieldset>
            <fieldset class="cell cell--chips">
              <legend class="cell__label" data-t="quote.volume"></legend>
              <div class="chips" id="chips-volume"></div>
            </fieldset>
          </div>

          <label class="cell">
            <span class="cell__label" data-t="quote.notes"></span>
            <textarea name="notes" rows="2" data-t-attr="placeholder:quote.notesPh"></textarea>
          </label>

          <div class="ship__foot">
            <div class="ship__barcode" id="quote-barcode" aria-hidden="true"></div>
            <div class="ship__actions">
              <p class="ship__error" id="quote-error" role="alert" hidden></p>
              <button class="btn btn--orange btn--lg btn--block" type="submit">
                <svg class="icon" aria-hidden="true"><use href="#i-wa"/></svg>
                <span data-t="quote.send"></span>
                <svg class="icon icon--arrow" aria-hidden="true"><use href="#i-arrow"/></svg>
              </button>
              <a class="ship__call" data-tel href="#">
                <svg class="icon" aria-hidden="true"><use href="#i-phone"/></svg>
                <span data-t="quote.orCall"></span>
              </a>
            </div>
          </div>
          </form>
        </div>
      </div>
    </section>

    <!-- ===================================================== ONDE ATENDE -->
    <section class="section area" id="onde" aria-labelledby="area-title" hidden>
      <div class="container area__grid">
        <div class="section-head" data-reveal>
          <p class="kicker" data-t="area.kicker"></p>
          <h2 class="title" id="area-title" data-t-rich="area.title"></h2>
          <p class="lead"><strong id="area-base"></strong> <span data-t="area.lead"></span></p>
        </div>
        <ul class="area__chips" id="area-list" data-reveal></ul>
      </div>
    </section>

    <!-- ===================================================== DÚVIDAS -->
    <section class="section faq" id="duvidas" aria-labelledby="faq-title">
      <div class="container faq__grid">
        <div class="section-head faq__head" data-reveal>
          <p class="kicker" data-t="faq.kicker"></p>
          <h2 class="title" id="faq-title" data-t-rich="faq.title"></h2>
          <p class="lead" data-t="faq.lead"></p>
          <a class="btn btn--orange" data-wa href="#" target="_blank" rel="noopener">
            <svg class="icon" aria-hidden="true"><use href="#i-wa"/></svg>
            <span data-t="ui.whatsapp"></span>
          </a>
        </div>
        <div class="faq__list" id="faq-list"></div>
      </div>
    </section>

    <!-- ===================================================== CONTATO -->
    <section class="section contact" id="contato" aria-labelledby="contact-title">
      <div class="contact__bg" aria-hidden="true"></div>
      <div class="container">
        <div class="contact__top" data-reveal>
          <p class="kicker kicker--light" data-t="contact.kicker"></p>
          <h2 class="contact__title" id="contact-title" data-t-rich="contact.title"></h2>
          <p class="lead lead--on-orange" data-t="contact.lead"></p>
          <div class="hero__ctas">
            <a class="btn btn--light btn--lg" data-wa href="#" target="_blank" rel="noopener">
              <svg class="icon" aria-hidden="true"><use href="#i-wa"/></svg>
              <span data-t="hero.whatsapp"></span>
            </a>
            <a class="btn btn--ghost btn--lg" data-tel href="#">
              <svg class="icon" aria-hidden="true"><use href="#i-phone"/></svg>
              <span data-t="hero.call"></span>
            </a>
          </div>
        </div>
        <ul class="contact__list" id="contact-list" data-reveal></ul>
      </div>
    </section>
  </main>

  <!-- ===================================================== RODAPÉ -->
  <footer class="site-footer">
    <div class="container footer-inner">
      <a class="brand" href="#topo" aria-label="GoHand Shop">
        <svg class="logo" viewBox="0 0 866 270" aria-hidden="true"><use href="#logo"/></svg>
      </a>
      <p class="footer-tagline" data-t="footer.tagline"></p>
      <p class="footer-legal">© <span id="year">2026</span> GoHand Shop. <span data-t="footer.rights"></span></p>
      <a class="footer-top" href="#topo">
        <span data-t="footer.top"></span>
        <svg class="icon" aria-hidden="true"><use href="#i-up"/></svg>
      </a>
    </div>
  </footer>

  <!-- Barra fixa no celular -->
  <div class="mobile-bar">
    <a class="btn btn--orange" data-wa href="#" target="_blank" rel="noopener">
      <svg class="icon" aria-hidden="true"><use href="#i-wa"/></svg>
      <span data-t="ui.whatsapp"></span>
    </a>
    <a class="btn btn--outline" data-tel href="#">
      <svg class="icon" aria-hidden="true"><use href="#i-phone"/></svg>
      <span data-t="ui.call"></span>
    </a>
  </div>

  <script src="assets/js/content.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
