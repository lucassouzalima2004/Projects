<!doctype html>
<html lang="en-IE">
<head>

  <style>
    .nf {
      --glow: #ff3d9a;
      display: grid;
      place-items: center;
      min-height: 100vh;
      min-height: 100svh;

      text-align: center;

    .nf .wm { font-size: 34px; color: var(--ink); }
    .nf-code { margin-top: 40px; font-size: clamp(120px, 26vw, 300px); line-height: 0.9; animation: nf-flicker 4s linear infinite; }
    .nf h1 {
      margin-top: 10px;
      font-family: var(--font-display);
      font-weight: 800;
      font-size: clamp(36px, 6vw, 72px);
      line-height: 0.95;
      text-transform: uppercase;
    }
    .nf p { margin: 16px auto 30px; max-width: 30em; color: var(--ink-2); }
    @keyframes nf-flicker {
      0%, 18%, 22%, 62%, 64%, 100% { opacity: 1; }
      20%, 63% { opacity: 0.2; }
    }
    @media (prefers-reduced-motion: reduce) { .nf-code { animation: none; } }
  </style>
</head>
