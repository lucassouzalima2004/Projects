<!doctype html>
<!-- Imagem de prévia do link (assets/img/og-image.jpg): abra num navegador com a janela em 1200×630 e tire um print.
     Não vai para o ar. -->
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Instrument+Sans:wght@400..700&display=swap">
  <style>
    * { box-sizing: border-box; margin: 0; }
    body { width: 1200px; height: 630px; overflow: hidden; font-family: "Instrument Sans", sans-serif; }
    .og {
      position: relative; width: 1200px; height: 630px; display: grid; grid-template-columns: 1fr 430px; gap: 40px; align-items: center;
      padding: 0 70px; color: #0C2236;
      background:
        radial-gradient(ellipse 50% 70% at 85% 30%, rgba(140, 248, 197, .55), transparent 70%),
        radial-gradient(ellipse 50% 60% at 5% 0%, rgba(113, 200, 209, .45), transparent 70%),
        linear-gradient(180deg, #E6F4F7, #F8FBFC);
    }
    .logo { width: 170px; }
    .pill { display: inline-block; margin-top: 34px; padding: 10px 18px; border-radius: 999px; background: #fff; font-weight: 650; font-size: 22px; box-shadow: inset 0 0 0 1px rgba(12, 34, 54, .12); }
    h1 { margin-top: 22px; font: 800 112px/.92 "Bricolage Grotesque", sans-serif; font-variation-settings: "opsz" 96; letter-spacing: -.035em; }
    h1 em { font-style: normal; background: linear-gradient(100deg, #8CF8C5, #B4FBDA) no-repeat 0 86% / 100% .32em; }
    .meta { display: flex; gap: 26px; white-space: nowrap; margin-top: 30px; font-size: 24px; font-weight: 600; color: #22384B; }
    .meta b { color: #F2B32C; letter-spacing: 2px; }
    .frame { padding: 14px; border-radius: 8px; background: linear-gradient(145deg, #224665, #0C2236 50%, #081827); box-shadow: 0 40px 70px -30px rgba(12, 34, 54, .55); }
    .mat { padding: 20px; background: #FCFBF8; box-shadow: inset 0 3px 8px rgba(0, 0, 0, .2); }
    .glass { position: relative; height: 430px; overflow: hidden; }
    .glass img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 30%; }
    .glass::after { content: ""; position: absolute; inset: 0; background: linear-gradient(118deg, transparent 22%, rgba(255, 255, 255, .3) 30%, transparent 37%, transparent 56%, rgba(255, 255, 255, .16) 61%, transparent 67%); }
    .dust { position: absolute; left: 0; right: 0; bottom: 0; height: 28%; background: rgba(196, 190, 178, .9); }
  </style>
</head>
<body>
  <div class="og">
    <div>
      <img class="logo" src="../assets/img/logo.svg" alt="">
      <div><span class="pill">✦ House &amp; commercial cleaning · Adelaide, SA</span></div>
      <h1>We clean,<br><em>you live.</em></h1>
      <div class="meta"><span><b>★★★★★</b> 5.0 on Google</span><span>Bond-back guarantee</span></div>
    </div>
    <div class="frame"><div class="mat"><div class="glass"><img src="../assets/img/hero-team.jpg" alt=""><div class="dust"></div></div></div></div>
  </div>
</body>
</html>
