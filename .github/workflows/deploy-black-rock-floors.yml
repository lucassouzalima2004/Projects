# Publica o site da Black Rock Floors no Cloudflare, sempre no mesmo link:
#   https://blackrockfloors.<subdomínio da conta>.workers.dev  (o endereço exato aparece no resumo da execução)
# Cada push que mexe em black-rock-floors/ (no main ou no branch claude/practical-goldberg-vyf1zm) atualiza esse link.
#
# O site vai como Worker com arquivos estáticos (Workers Static Assets), como a The Berry Coffee,
# e não como projeto do Cloudflare Pages: a conta já tem 100 projetos no Pages, o limite do Cloudflare.
# O script do Worker (black-rock-floors/worker.js) só roda em dois casos: nos vídeos, para entregar o pedaço do
# arquivo que o navegador pede (cabeçalho Range), sem o qual o iPhone e o Safari não tocam o vídeo do topo; e em
# endereços que não existem, para responder a página 404 sem cache.
#
# Usa os mesmos secrets dos outros sites do repositório (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   token do Cloudflare que pode publicar Workers (obrigatório)
#   CLOUDFLARE_ACCOUNT_ID  ID da conta (opcional: sem ele, o workflow descobre a conta pelo token)
# E uma variável opcional (mesma tela, aba Variables):
#   BLACKROCK_SITE_URL     o endereço final, quando o domínio do Gabriel estiver ligado ao site
#                          (ex.: https://www.blackrockfloors.com). Sem ela, o canonical, o sitemap
#                          e a prévia do link usam o endereço .workers.dev.
# Enquanto o token não existir, o workflow só avisa e não falha.
name: Deploy Black Rock Floors (Cloudflare)

on:
  push:
    branches: [main, claude/practical-goldberg-vyf1zm]
    paths:
      - 'black-rock-floors/**'
      - '.github/workflows/deploy-black-rock-floors.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: black-rock-floors-deploy
  cancel-in-progress: false

env:
  WORKER: blackrockfloors

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.creds.outputs.ready }}
    steps:
      - name: Conferir o token do Cloudflare
        id: creds
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Cloudflare sem credenciais::Falta o secret CLOUDFLARE_API_TOKEN. Cadastre em Settings → Secrets and variables → Actions e rode de novo (abra a execução em Actions → Re-run all jobs)."
          fi

  deploy:
    needs: check
    if: needs.check.outputs.ready == 'true'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ACCOUNT_SECRET: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      SITE_VAR: ${{ vars.BLACKROCK_SITE_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Instalar o wrangler
        run: npm install --no-save --no-audit --no-fund --include=optional wrangler@4

      - name: Conta do Cloudflare
        run: |
          id="$ACCOUNT_SECRET"
          if [ -z "$id" ]; then
            # Sem o secret, descobre a conta pelo próprio token
            auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
            id=$(curl -sS -H "$auth" "https://api.cloudflare.com/client/v4/accounts?per_page=50" | jq -r '.result[]?.id')
            if [ -z "$id" ]; then
              id=$(curl -sS -H "$auth" "https://api.cloudflare.com/client/v4/memberships?per_page=50" | jq -r '.result[]?.account.id')
            fi
            count=$(printf '%s\n' "$id" | grep -c . || true)
            if [ "$count" != "1" ]; then
              echo "::error title=Conta do Cloudflare::O token dá acesso a $count contas. Cadastre o secret CLOUDFLARE_ACCOUNT_ID com o ID da conta certa (Cloudflare → Workers & Pages → Account ID)."
              exit 1
            fi
            echo "::add-mask::$id"
            echo "Conta encontrada pelo token."
          fi
          echo "CLOUDFLARE_ACCOUNT_ID=$id" >> "$GITHUB_ENV"

      - name: Endereço do site e conferência do nome
        run: |
          acc="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          sub=$(curl -sS -H "$auth" "$acc/workers/subdomain" | jq -r '.result.subdomain // empty')
          if [ -z "$sub" ]; then
            echo "::error title=workers.dev::A conta não tem subdomínio workers.dev. Crie em Cloudflare → Workers & Pages → (lado direito) Subdomain e rode de novo."
            exit 1
          fi
          url="https://$WORKER.$sub.workers.dev"
          echo "WORKERS_URL=$url" >> "$GITHUB_ENV"
          site="${SITE_VAR:-$url}"
          echo "SITE_URL=${site%/}" >> "$GITHUB_ENV"
          # Não sobrescreve um Worker com o mesmo nome que não seja este site
          if curl -sS -H "$auth" "$acc/workers/scripts/$WORKER/settings" | jq -e '.success' > /dev/null; then
            if curl -fsS --max-time 20 "$url/" | grep -q "Black Rock Floors"; then
              echo "O Worker $WORKER já é este site: vai ser atualizado."
            else
              echo "::error title=Nome em uso::Já existe um Worker chamado $WORKER nesta conta que não é este site. Apague ou renomeie esse Worker, ou troque WORKER no topo deste workflow."
              exit 1
            fi
          else
            echo "Primeira publicação: o Worker $WORKER vai ser criado."
          fi

      - name: Montar o site
        run: |
          mkdir -p _site
          cp -R black-rock-floors/. _site/
          # Anotações internas, o script do vídeo e o do Worker não vão para o ar como arquivos
          rm -rf _site/README.md _site/tools _site/.gitignore _site/worker.js
          today=$(date -u +%F)
          : > pages.txt
          # Em cada página: endereço completo no og:image (o WhatsApp exige), canonical e og:url
          { echo _site/index.html; find _site -mindepth 2 -name 'index.html' | sort; } | while read -r f; do
            rel="${f#_site/}"
            path="/${rel%index.html}"
            sed -i -E "s#content=\"(\.\./)*assets/img/og-image.jpg\"#content=\"$SITE_URL/assets/img/og-image.jpg\"#" "$f"
            # Só no <title> da página (o mapa também tem um <title> dentro do SVG)
            sed -i "0,/<\/title>/s#</title>#</title>\n  <link rel=\"canonical\" href=\"$SITE_URL$path\">\n  <meta property=\"og:url\" content=\"$SITE_URL$path\">#" "$f"
            echo "$path" >> pages.txt
          done
          {
            echo '<?xml version="1.0" encoding="UTF-8"?>'
            echo '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">'
            while read -r p; do echo "  <url><loc>$SITE_URL$p</loc><lastmod>$today</lastmod></url>"; done < pages.txt
            echo '</urlset>'
          } > _site/sitemap.xml
          printf 'User-agent: *\nAllow: /\n\nSitemap: %s/sitemap.xml\n' "$SITE_URL" > _site/robots.txt
          cat _site/sitemap.xml
          cat > wrangler.jsonc <<EOF
          {
            "name": "$WORKER",
            "main": "./black-rock-floors/worker.js",
            "compatibility_date": "2025-10-01",
            "workers_dev": true,
            "preview_urls": false,
            "assets": {
              "directory": "./_site",
              "binding": "ASSETS",
              "not_found_handling": "none",
              "html_handling": "auto-trailing-slash",
              "run_worker_first": ["/assets/video/*"]
            }
          }
          EOF

      - name: Publicar
        run: npx wrangler deploy --config wrangler.jsonc

      - name: Conferir o site no ar
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS --max-time 20 "$WORKERS_URL/" | grep -q "Floors done right"; then
              echo "Site no ar: $WORKERS_URL"
              echo "### Site no ar: $WORKERS_URL" >> "$GITHUB_STEP_SUMMARY"
              if [ "$SITE_URL" != "$WORKERS_URL" ]; then
                echo "Endereço oficial (canonical e sitemap): $SITE_URL" >> "$GITHUB_STEP_SUMMARY"
              fi
              # O vídeo precisa responder com um pedaço (206), senão o iPhone não toca
              code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 -H 'Range: bytes=0-1' "$WORKERS_URL/assets/video/hero-tall.mp4" || true)
              if [ "$code" = "206" ]; then
                echo "Vídeo responde por pedaço (206): toca no iPhone."
              else
                echo "::warning title=Vídeo sem Range::O vídeo respondeu $code em vez de 206 a um pedido por pedaço. O iPhone pode não tocar o vídeo do topo: confira o worker.js e o run_worker_first."
              fi
              # Endereço que não existe: página 404 sem cache (o worker.js responde), para uma foto nova que ainda
              # não chegou a todos os servidores não ficar "não encontrada" por uma semana no navegador de alguém
              nf=$(curl -sS -o /dev/null -D - --max-time 20 "$WORKERS_URL/assets/img/nao-existe-$(date +%s).webp" | tr -d '\r' || true)
              if echo "$nf" | grep -q '^HTTP/[0-9.]* 404' && echo "$nf" | grep -qi '^cache-control: no-store'; then
                echo "Endereço que não existe: 404 sem cache."
              else
                echo "::warning title=404 com cache::Um endereço que não existe não respondeu 404 com Cache-Control no-store. Confira o worker.js e o not_found_handling."
              fi
              exit 0
            fi
            sleep 10
          done
          echo "::warning title=Site ainda não respondeu::A publicação terminou, mas $WORKERS_URL ainda não respondeu. Tente abrir de novo em alguns minutos."
          echo "### Publicado em: $WORKERS_URL (ainda carregando)" >> "$GITHUB_STEP_SUMMARY"
