# Publica o site da Black Rock Remodeling no Cloudflare a cada push que mexe em black-rock-floors/ (no main ou no
# branch claude/practical-goldberg-vyf1zm).
#
# Desde 16/11 o site mora na conta Cloudflare do Gabriel, no domínio dele, blackrockremod.com (registrado no próprio
# Cloudflare). O Lucas entra nessa conta como membro (Administrator). São dois Workers:
#   blackrockremod   conta do Gabriel   o site: black-rock-floors/ + worker.js, em blackrockremod.com e www
#   blackrockfloors  conta do Lucas     o domínio antigo: black-rock-floors/redirect-worker.js leva cada endereço de
#                                       blackrockfloors.com e www para o mesmo caminho no domínio novo (301)
# O redirecionamento só é publicado depois que o domínio novo responde com o site. Se a publicação nova falhar, o
# domínio antigo continua como estava.
#
# Vai como Worker com arquivos estáticos (Workers Static Assets), e não como Cloudflare Pages. O worker.js roda nas
# páginas (para mandar www e http:// ao endereço oficial), nos vídeos (pedaço por Range, sem o qual o iPhone e o Safari
# não tocam o vídeo do topo), no formulário (e-mail pelo Email Routing do próprio Cloudflare, ligação EMAIL) e em
# endereços que não existem (página 404 sem cache). Fotos, CSS, JS e fontes saem direto dos arquivos.
#
# Secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN            token do Lucas, o mesmo dos outros sites (obrigatório)
#   BLACKROCK_CLOUDFLARE_API_TOKEN  token com acesso à conta do Gabriel (opcional: sem ele, usa o CLOUDFLARE_API_TOKEN,
#                                   que serve se tiver sido criado para todas as contas do Lucas)
# Variables (mesma tela, aba Variables):
#   BLACKROCK_ACCOUNT_ID   ID da conta do Gabriel
#   LUCAS_ACCOUNT_ID       ID da conta do Lucas
name: Deploy Black Rock Floors (Cloudflare)

on:
  push:
    branches: [main, claude/practical-goldberg-vyf1zm]
    paths:
      - 'black-rock-floors/**'
      - '.github/workflows/deploy-black-rock-floors.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: black-rock-floors-deploy
  cancel-in-progress: false

env:
  SITE_WORKER: blackrockremod
  OLD_WORKER: blackrockfloors
  SITE_URL: https://blackrockremod.com
  OLD_URL: https://blackrockfloors.com
  MAIL_TO: br.remodelingwa@gmail.com
  MAIL_FROM: Black Rock Website <estimates@blackrockremod.com>
  # Texto que só existe neste site
  SITE_MARK: 'Remodeling [Ss]ervices'

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.creds.outputs.ready }}
    steps:
      - name: Conferir token e contas
        id: creds
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SITE_ACCOUNT: ${{ vars.BLACKROCK_ACCOUNT_ID }}
          OLD_ACCOUNT: ${{ vars.LUCAS_ACCOUNT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$SITE_ACCOUNT" ] && [ -n "$OLD_ACCOUNT" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Faltam credenciais::Precisa do secret CLOUDFLARE_API_TOKEN e das variables BLACKROCK_ACCOUNT_ID e LUCAS_ACCOUNT_ID (Settings → Secrets and variables → Actions)."
          fi

  site:
    needs: check
    if: needs.check.outputs.ready == 'true'
    runs-on: ubuntu-latest
    outputs:
      live: ${{ steps.live.outputs.live }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.BLACKROCK_CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.BLACKROCK_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Esconder o ID da conta no log
        run: echo "::add-mask::$CLOUDFLARE_ACCOUNT_ID"

      - name: Instalar o wrangler
        run: npm install --no-save --no-audit --no-fund --include=optional wrangler@4

      - name: Montar o site
        run: |
          mkdir -p _site
          cp -R black-rock-floors/. _site/
          # Anotações internas, os scripts e os Workers não vão para o ar como arquivos
          rm -rf _site/README.md _site/tools _site/.gitignore _site/worker.js _site/redirect-worker.js
          today=$(date -u +%F)
          : > pages.txt
          # Em cada página: endereço completo no og:image (o WhatsApp exige), canonical e og:url
          { echo _site/index.html; find _site -mindepth 2 -name 'index.html' | sort; } | while read -r f; do
            rel="${f#_site/}"
            path="/${rel%index.html}"
            sed -i -E "s#content=\"(\.\./)*assets/img/og-image.jpg(\?v=[0-9]+)?\"#content=\"$SITE_URL/assets/img/og-image.jpg\2\"#" "$f"
            # Só no <title> da página (o mapa também tem um <title> dentro do SVG)
            sed -i "0,/<\/title>/s#</title>#</title>\n  <link rel=\"canonical\" href=\"$SITE_URL$path\">\n  <meta property=\"og:url\" content=\"$SITE_URL$path\">#" "$f"
            echo "$path" >> pages.txt
          done
          {
            echo '<?xml version="1.0" encoding="UTF-8"?>'
            echo '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">'
            while read -r p; do echo "  <url><loc>$SITE_URL$p</loc><lastmod>$today</lastmod></url>"; done < pages.txt
            echo '</urlset>'
          } > _site/sitemap.xml
          printf 'User-agent: *\nAllow: /\n\nSitemap: %s/sitemap.xml\n' "$SITE_URL" > _site/robots.txt
          cat _site/sitemap.xml
          host="${SITE_URL#https://}"
          cat > wrangler.jsonc <<EOF
          {
            "name": "$SITE_WORKER",
            "main": "./black-rock-floors/worker.js",
            "compatibility_date": "2025-10-01",
            "workers_dev": false,
            "preview_urls": false,
            "routes": [
              { "pattern": "$host", "custom_domain": true },
              { "pattern": "www.$host", "custom_domain": true }
            ],
            "vars": { "MAIL_TO": "$MAIL_TO", "MAIL_FROM": "$MAIL_FROM" },
            "send_email": [{ "name": "EMAIL", "destination_address": "$MAIL_TO" }],
            "assets": {
              "directory": "./_site",
              "binding": "ASSETS",
              "not_found_handling": "none",
              "html_handling": "auto-trailing-slash",
              "run_worker_first": ["/", "/*/", "/robots.txt", "/sitemap.xml", "/assets/video/*", "/api/*"]
            }
          }
          EOF

      - name: Publicar na conta do Gabriel
        run: |
          if ! npx wrangler deploy --config wrangler.jsonc; then
            echo "::error title=Sem acesso à conta do Gabriel::O token não publicou na conta do Gabriel. Crie lá um token (Workers Scripts e Workers Routes: Edit; Zone e DNS: Read) e cadastre como secret BLACKROCK_CLOUDFLARE_API_TOKEN."
            exit 1
          fi

      - name: Conferir o domínio novo
        id: live
        run: |
          # O certificado do domínio novo pode levar alguns minutos na primeira vez
          for i in $(seq 1 30); do
            if curl -fsS --max-time 20 "$SITE_URL/" 2>/dev/null | grep -Eq "$SITE_MARK"; then
              echo "live=true" >> "$GITHUB_OUTPUT"
              echo "### Site no ar: $SITE_URL" >> "$GITHUB_STEP_SUMMARY"
              # O vídeo precisa responder com um pedaço (206), senão o iPhone não toca
              code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 -H 'Range: bytes=0-1' "$SITE_URL/assets/video/hero-tall.mp4" || true)
              if [ "$code" = "206" ]; then
                echo "Vídeo responde por pedaço (206): toca no iPhone."
              else
                echo "::warning title=Vídeo sem Range::O vídeo respondeu $code em vez de 206 a um pedido por pedaço. O iPhone pode não tocar o vídeo do topo: confira o worker.js e o run_worker_first."
              fi
              # Endereço que não existe: 404 sem cache, para uma foto nova que ainda não chegou a todos os servidores
              # não ficar "não encontrada" por uma semana no navegador de alguém
              nf=$(curl -sS -o /dev/null -D - --max-time 20 "$SITE_URL/assets/img/nao-existe-$(date +%s).webp" | tr -d '\r' || true)
              if echo "$nf" | grep -q '^HTTP/[0-9.]* 404' && echo "$nf" | grep -qi '^cache-control: no-store'; then
                echo "Endereço que não existe: 404 sem cache."
              else
                echo "::warning title=404 com cache::Um endereço que não existe não respondeu 404 com Cache-Control no-store. Confira o worker.js e o not_found_handling."
              fi
              # www e http:// têm que levar ao endereço oficial (301), senão o Google indexa a mesma página duas vezes
              host="${SITE_URL#https://}"
              for from in "https://www.$host/flooring/" "http://$host/flooring/"; do
                to=$(curl -sS -o /dev/null -w '%{http_code} %{redirect_url}' --max-time 20 "$from" || true)
                if [ "$to" = "301 $SITE_URL/flooring/" ]; then
                  echo "$from → 301 para o endereço oficial."
                else
                  echo "::warning title=Sem redirecionamento::$from respondeu \"$to\" em vez de 301 para $SITE_URL/flooring/."
                fi
              done
              exit 0
            fi
            sleep 10
          done
          echo "live=false" >> "$GITHUB_OUTPUT"
          echo "::warning title=Domínio novo ainda não responde::A publicação terminou, mas $SITE_URL ainda não mostra o site. O domínio antigo não foi mexido. Rode de novo (Re-run all jobs) em alguns minutos."

  old-domain:
    needs: site
    if: needs.site.outputs.live == 'true'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.LUCAS_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Esconder o ID da conta no log
        run: echo "::add-mask::$CLOUDFLARE_ACCOUNT_ID"

      - name: Instalar o wrangler
        run: npm install --no-save --no-audit --no-fund --include=optional wrangler@4

      - name: Publicar o redirecionamento do domínio antigo
        run: |
          # Os domínios blackrockfloors.com e www foram ligados a este Worker pelo painel (17/10); o deploy não mexe neles
          cat > wrangler.redirect.jsonc <<EOF
          {
            "name": "$OLD_WORKER",
            "main": "./black-rock-floors/redirect-worker.js",
            "compatibility_date": "2025-10-01",
            "workers_dev": true,
            "preview_urls": false,
            "vars": { "TARGET": "$SITE_URL" }
          }
          EOF
          npx wrangler deploy --config wrangler.redirect.jsonc

      - name: Conferir o domínio antigo
        run: |
          for i in 1 2 3 4 5 6; do
            to=$(curl -sS -o /dev/null -w '%{http_code} %{redirect_url}' --max-time 20 "$OLD_URL/flooring/" || true)
            if [ "$to" = "301 $SITE_URL/flooring/" ]; then
              echo "$OLD_URL/flooring/ → 301 para $SITE_URL/flooring/"
              echo "Domínio antigo: $OLD_URL leva para $SITE_URL" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo "::warning title=Domínio antigo sem redirecionamento::$OLD_URL/flooring/ respondeu \"$to\" em vez de 301 para $SITE_URL/flooring/."
