# Publica o site no GitHub Pages: https://<usuario>.github.io/<repositorio>/nail-studio/
#
# Ativar uma vez: Settings → Pages → Build and deployment → Source: "GitHub Actions".
# Enquanto o Pages estiver desligado, o workflow só avisa e não falha.
name: Deploy site (GitHub Pages)

on:
  push:
    branches: [main, claude/card-services-website-gjhr8a]
    paths:
      - 'nail-studio/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.pages.outputs.ready }}
    steps:
      - name: Conferir se o GitHub Pages está ativado
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build_type=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .build_type 2>/dev/null || true)
          if [ "$build_type" = "workflow" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=GitHub Pages desligado::Ative em Settings → Pages → Source: GitHub Actions e rode este workflow de novo (Actions → Deploy site → Run workflow)."
          fi

  deploy:
    needs: check
    if: needs.check.outputs.ready == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}nail-studio/
    steps:
      - uses: actions/checkout@v4

      - id: pages
        uses: actions/configure-pages@v5

      - name: Montar o site
        run: |
          mkdir -p _site
          cp -R nail-studio _site/nail-studio
          # O WhatsApp só mostra a imagem da prévia do link com o endereço completo
          sed -i 's#content="assets/img/og-image.jpg"#content="${{ steps.pages.outputs.base_url }}/nail-studio/assets/img/og-image.jpg"#' _site/nail-studio/index.html
          printf '%s\n' '<!doctype html>' '<meta charset="utf-8">' '<meta http-equiv="refresh" content="0; url=nail-studio/">' '<title>Bossa Nail Studio</title>' '<a href="nail-studio/">Bossa Nail Studio</a>' > _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
