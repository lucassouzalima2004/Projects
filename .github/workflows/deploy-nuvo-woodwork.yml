# Publica o site da NUVO Woodwork no Cloudflare Pages (https://nuvo-woodwork.pages.dev).
#
# Usa os mesmos dois secrets do site da Bossa (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   token do Cloudflare com a permissão "Account · Cloudflare Pages · Edit"
#   CLOUDFLARE_ACCOUNT_ID  ID da conta do Cloudflare
# Enquanto os secrets não existirem, o workflow só avisa e não falha.
name: Deploy NUVO Woodwork (Cloudflare Pages)

on:
  push:
    branches: [main, claude/youthful-edison-3xnrzg]
    paths:
      - 'nuvo-woodwork/**'
      - '.github/workflows/deploy-nuvo-woodwork.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-nuvo-${{ github.ref }}
  cancel-in-progress: false

env:
  PROJECT: nuvo-woodwork

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.creds.outputs.ready }}
    steps:
      - name: Conferir os secrets do Cloudflare
        id: creds
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Cloudflare sem credenciais::Adicione CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID em Settings → Secrets and variables → Actions e rode este workflow de novo (Actions → Deploy NUVO Woodwork → Run workflow)."
          fi

  deploy:
    needs: check
    if: needs.check.outputs.ready == 'true'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Instalar o wrangler
        run: npm install --no-save --no-audit --no-fund --include=optional wrangler@4

      - name: Criar o projeto no Cloudflare Pages (só na primeira vez)
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects"
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          if ! curl -fsS -o /dev/null -H "$auth" "$api/$PROJECT"; then
            curl -sS --fail-with-body -X POST -H "$auth" -H "Content-Type: application/json" \
              --data "{\"name\":\"$PROJECT\",\"production_branch\":\"${{ github.event.repository.default_branch }}\"}" "$api"
          fi
          project=$(curl -fsS -H "$auth" "$api/$PROJECT")
          echo "DOMAIN=$(jq -r '.result.subdomain' <<<"$project")" >> "$GITHUB_ENV"
          # Publica sempre como produção, seja qual for o branch do git, para o endereço principal mostrar a última versão
          echo "PROD_BRANCH=$(jq -r '.result.production_branch' <<<"$project")" >> "$GITHUB_ENV"

      - name: Montar o site
        run: |
          mkdir -p _site
          cp -R nuvo-woodwork/. _site/
          # Anotações, prompts, script e vídeos originais não vão para o ar
          rm -rf _site/README.md _site/PROMPTS.md _site/tools _site/videos _site/.gitignore
          # O WhatsApp só mostra a imagem da prévia do link com o endereço completo
          sed -i "s#content=\"assets/img/og-image.jpg\"#content=\"https://$DOMAIN/assets/img/og-image.jpg\"#" _site/index.html

      - name: Publicar
        run: npx wrangler pages deploy _site --project-name="$PROJECT" --branch="$PROD_BRANCH" --commit-dirty=true

      - name: Endereço do site
        run: |
          echo "Site no ar: https://$DOMAIN"
          echo "Site no ar: https://$DOMAIN" >> "$GITHUB_STEP_SUMMARY"
