# Publica o site da NUVO Woodwork no Cloudflare Pages (https://nuvo-woodwork.pages.dev). Com a conta no limite de
# projetos do Pages, publica como Worker: https://nuvo-woodwork.lucassouzalima10.workers.dev
#
# Usa os secrets dos outros sites (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   token do Cloudflare com a permissão "Account · Cloudflare Pages · Edit" (obrigatório)
#   CLOUDFLARE_ACCOUNT_ID  ID da conta do Cloudflare. Pode ficar em Secrets ou em Variables; se não existir,
#                          o workflow tenta descobrir pelo próprio token (funciona quando o token vê uma conta só)
# Sem o token, o workflow só avisa e não falha.
name: Deploy NUVO Woodwork (Cloudflare)

on:
  push:
    branches: [main, claude/youthful-edison-3xnrzg]
    paths:
      - 'nuvo-woodwork/**'
      - '.github/workflows/deploy-nuvo-woodwork.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-nuvo-${{ github.ref }}
  cancel-in-progress: false

env:
  PROJECT: nuvo-woodwork

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.creds.outputs.ready }}
    steps:
      - name: Conferir o token do Cloudflare
        id: creds
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Cloudflare sem credenciais::Adicione o secret CLOUDFLARE_API_TOKEN em Settings → Secrets and variables → Actions e rode este workflow de novo (Actions → Deploy NUVO Woodwork → Run workflow)."
          fi

  deploy:
    needs: check
    if: needs.check.outputs.ready == 'true'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ACCOUNT_SETTING: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Descobrir a conta do Cloudflare
        run: |
          account="$ACCOUNT_SETTING"
          if [ -z "$account" ]; then
            accounts=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts?per_page=50" || true)
            count=$(jq -r '(.result // []) | length' <<<"$accounts" 2>/dev/null || echo 0)
            if [ "$count" = "1" ]; then
              account=$(jq -r '.result[0].id' <<<"$accounts")
              echo "Conta encontrada pelo token: $(jq -r '.result[0].name' <<<"$accounts")"
            else
              echo "::error title=Falta o ID da conta do Cloudflare::O token não mostrou uma conta única ($count). Salve o ID em Settings → Secrets and variables → Actions → New repository secret, com o nome CLOUDFLARE_ACCOUNT_ID (o ID aparece no Cloudflare em Workers & Pages, na lateral direita), e rode este workflow de novo."
              exit 1
            fi
          fi
          echo "ACCOUNT_ID=$account" >> "$GITHUB_ENV"

      - name: Instalar o wrangler
        run: npm install --no-save --no-audit --no-fund --include=optional wrangler@4

      - name: Criar o projeto no Cloudflare Pages (só na primeira vez)
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/pages/projects"
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          if ! curl -fsS -o /dev/null -H "$auth" "$api/$PROJECT"; then
            res=$(curl -sS -X POST -H "$auth" -H "Content-Type: application/json" \
              --data "{\"name\":\"$PROJECT\",\"production_branch\":\"${{ github.event.repository.default_branch }}\"}" "$api")
            if ! jq -e '.success' <<<"$res" >/dev/null; then
              echo "$res"
              # Conta no limite de projetos do Pages: publica como Worker (endereço .workers.dev)
              if jq -e '.errors[]? | select(.code == 8000027)' <<<"$res" >/dev/null; then
                echo "::warning title=Limite de projetos do Pages::A conta já tem o máximo de projetos do Cloudflare Pages. O site vai como Worker, no endereço .workers.dev. Para usar o .pages.dev, apague um projeto antigo do Pages e rode o workflow de novo."
                sub=$(curl -sS -H "$auth" "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/subdomain" | jq -r '.result.subdomain // empty' || true)
                echo "TARGET=workers" >> "$GITHUB_ENV"
                if [ -n "$sub" ]; then echo "DOMAIN=$PROJECT.$sub.workers.dev" >> "$GITHUB_ENV"; fi
                exit 0
              fi
              exit 1
            fi
          fi
          project=$(curl -fsS -H "$auth" "$api/$PROJECT")
          echo "TARGET=pages" >> "$GITHUB_ENV"
          echo "DOMAIN=$(jq -r '.result.subdomain' <<<"$project")" >> "$GITHUB_ENV"
          # Publica sempre como produção, seja qual for o branch do git, para o endereço principal mostrar a última versão
          echo "PROD_BRANCH=$(jq -r '.result.production_branch' <<<"$project")" >> "$GITHUB_ENV"

      - name: Montar o site
        run: |
          mkdir -p _site
          cp -R nuvo-woodwork/. _site/
          # Anotações, prompts, script e vídeos originais não vão para o ar
          rm -rf _site/README.md _site/PROMPTS.md _site/tools _site/videos _site/.gitignore
          # O WhatsApp só mostra a imagem da prévia do link com o endereço completo
          if [ -n "${DOMAIN:-}" ]; then
            sed -i "s#content=\"assets/img/og-image.jpg\"#content=\"https://$DOMAIN/assets/img/og-image.jpg\"#" _site/index.html
          fi

      - name: Publicar
        run: |
          set -o pipefail
          if [ "$TARGET" = workers ]; then
            CLOUDFLARE_ACCOUNT_ID="$ACCOUNT_ID" npx wrangler deploy --name="$PROJECT" --assets=_site --compatibility-date=2026-10-01 | tee deploy.log
            # Endereço que o wrangler informou (vale mais que o calculado)
            url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -n 1 || true)
            if [ -n "$url" ]; then echo "DOMAIN=${url#https://}" >> "$GITHUB_ENV"; fi
          else
            CLOUDFLARE_ACCOUNT_ID="$ACCOUNT_ID" npx wrangler pages deploy _site --project-name="$PROJECT" --branch="$PROD_BRANCH" --commit-dirty=true
          fi

      - name: Endereço do site
        run: |
          echo "Site no ar: https://$DOMAIN"
          echo "Site no ar: https://$DOMAIN" >> "$GITHUB_STEP_SUMMARY"
