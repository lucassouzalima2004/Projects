# Publica o site da The Berry Coffee no Cloudflare Pages, sempre no mesmo link:
#   https://theberrycoffee.pages.dev
# Cada push que mexe em berry-coffee/ (no main ou no branch claude/keen-tesla-fjkq02) atualiza esse link.
# Cada publicação também ganha um endereço próprio (https://<código>.theberrycoffee.pages.dev), que fica de histórico.
#
# Usa os secrets dos outros sites do repositório (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   token do Cloudflare com a permissão "Account · Cloudflare Pages · Edit" (obrigatório)
#   CLOUDFLARE_ACCOUNT_ID  ID da conta do Cloudflare (opcional: sem ele, o workflow descobre a conta pelo token)
# Enquanto o token não existir, o workflow só avisa e não falha.
name: Deploy The Berry Coffee (Cloudflare Pages)

on:
  push:
    branches: [main, claude/keen-tesla-fjkq02]
    paths:
      - 'berry-coffee/**'
      - '.github/workflows/deploy-berry-coffee.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: berry-coffee-pages
  cancel-in-progress: false

env:
  PROJECT: theberrycoffee

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.creds.outputs.ready }}
    steps:
      - name: Conferir os secrets do Cloudflare
        id: creds
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            [ -z "$ACCOUNT" ] && echo "Sem CLOUDFLARE_ACCOUNT_ID: a conta vai ser descoberta pelo token."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Cloudflare sem credenciais::Falta o secret CLOUDFLARE_API_TOKEN. Cadastre em Settings → Secrets and variables → Actions e rode de novo (abra a execução em Actions → Re-run all jobs)."
          fi
          true

  deploy:
    needs: check
    if: needs.check.outputs.ready == 'true'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ACCOUNT_SECRET: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Instalar o wrangler
        run: npm install --no-save --no-audit --no-fund --include=optional wrangler@4

      - name: Conta do Cloudflare
        run: |
          id="$ACCOUNT_SECRET"
          if [ -z "$id" ]; then
            # Sem o secret, descobre a conta pelo próprio token
            auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
            id=$(curl -sS -H "$auth" "https://api.cloudflare.com/client/v4/accounts?per_page=50" | jq -r '.result[]?.id')
            if [ -z "$id" ]; then
              id=$(curl -sS -H "$auth" "https://api.cloudflare.com/client/v4/memberships?per_page=50" | jq -r '.result[]?.account.id')
            fi
            count=$(printf '%s\n' "$id" | grep -c . || true)
            if [ "$count" != "1" ]; then
              echo "::error title=Conta do Cloudflare::O token dá acesso a $count contas. Cadastre o secret CLOUDFLARE_ACCOUNT_ID com o ID da conta certa (Cloudflare → Workers & Pages → Account ID)."
              exit 1
            fi
            echo "::add-mask::$id"
            echo "Conta encontrada pelo token."
          fi
          echo "CLOUDFLARE_ACCOUNT_ID=$id" >> "$GITHUB_ENV"

      - name: Criar o projeto no Cloudflare Pages (só na primeira vez)
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects"
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          if ! curl -fsS -o /dev/null -H "$auth" "$api/$PROJECT"; then
            curl -sS --fail-with-body -X POST -H "$auth" -H "Content-Type: application/json" \
              --data "{\"name\":\"$PROJECT\",\"production_branch\":\"main\"}" "$api"
          fi
          info=$(curl -fsS -H "$auth" "$api/$PROJECT")
          # Se o nome já estiver em uso no Cloudflare, o endereço ganha um sufixo; aqui pegamos o endereço real
          echo "SITE_URL=https://$(echo "$info" | jq -r '.result.subdomain')" >> "$GITHUB_ENV"
          # Publicar como "produção" do projeto faz o site aparecer no link principal, sem o nome do branch
          echo "PROD_BRANCH=$(echo "$info" | jq -r '.result.production_branch')" >> "$GITHUB_ENV"

      - name: Montar o site
        run: |
          mkdir -p _site
          cp -R berry-coffee/. _site/
          # O README tem anotações internas e não vai para o ar
          rm -f _site/README.md
          # O WhatsApp só mostra a imagem da prévia do link com o endereço completo
          sed -i "s#content=\"assets/img/og-image.jpg\"#content=\"$SITE_URL/assets/img/og-image.jpg\"#" _site/index.html

      - name: Publicar
        run: |
          npx wrangler pages deploy _site --project-name="$PROJECT" --branch="$PROD_BRANCH" \
            --commit-hash="$GITHUB_SHA" --commit-message="${GITHUB_REF_NAME}@${GITHUB_SHA::7}" --commit-dirty=true

      - name: Endereço do site
        run: |
          echo "Site no ar: $SITE_URL"
          echo "### Site no ar: $SITE_URL" >> "$GITHUB_STEP_SUMMARY"
