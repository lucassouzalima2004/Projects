# Publica o site da The Berry Coffee no Cloudflare Pages.
#   main ............................ https://the-berry-coffee.pages.dev
#   outros branches (prévia) ........ https://<nome-do-branch>.the-berry-coffee.pages.dev
#                                     ex.: https://claude-keen-tesla-fjkq02.the-berry-coffee.pages.dev
#
# Usa os mesmos dois secrets do site da manicure (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   token do Cloudflare com a permissão "Account · Cloudflare Pages · Edit"
#   CLOUDFLARE_ACCOUNT_ID  ID da conta do Cloudflare
# Enquanto os secrets não existirem, o workflow só avisa e não falha.
name: Deploy The Berry Coffee (Cloudflare Pages)

on:
  push:
    branches: [main, claude/keen-tesla-fjkq02]
    paths:
      - 'berry-coffee/**'
      - '.github/workflows/deploy-berry-coffee.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: berry-coffee-pages-${{ github.ref }}
  cancel-in-progress: false

env:
  PROJECT: the-berry-coffee

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.creds.outputs.ready }}
    steps:
      - name: Conferir os secrets do Cloudflare
        id: creds
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Cloudflare sem credenciais::Adicione CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID em Settings → Secrets and variables → Actions e rode este workflow de novo (Actions → Deploy The Berry Coffee → Run workflow)."
          fi

  deploy:
    needs: check
    if: needs.check.outputs.ready == 'true'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BRANCH: ${{ github.ref_name }}
      MAIN: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v4

      - name: Instalar o wrangler
        run: npm install --no-save --no-audit --no-fund --include=optional wrangler@4

      - name: Criar o projeto no Cloudflare Pages (só na primeira vez)
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects"
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          if ! curl -fsS -o /dev/null -H "$auth" "$api/$PROJECT"; then
            curl -sS --fail-with-body -X POST -H "$auth" -H "Content-Type: application/json" \
              --data "{\"name\":\"$PROJECT\",\"production_branch\":\"$MAIN\"}" "$api"
          fi
          domain=$(curl -fsS -H "$auth" "$api/$PROJECT" | jq -r '.result.subdomain')
          # Branch que não é o principal vira prévia: o Cloudflare usa o nome em minúsculas, com hífen no lugar de / e outros símbolos
          if [ "$BRANCH" = "$MAIN" ]; then
            url="https://$domain"
          else
            alias=$(printf '%s' "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g')
            url="https://$alias.$domain"
          fi
          echo "SITE_URL=$url" >> "$GITHUB_ENV"

      - name: Montar o site
        run: |
          mkdir -p _site
          cp -R berry-coffee/. _site/
          # O README tem anotações internas e não vai para o ar
          rm -f _site/README.md
          # O WhatsApp só mostra a imagem da prévia do link com o endereço completo
          sed -i "s#content=\"assets/img/og-image.jpg\"#content=\"$SITE_URL/assets/img/og-image.jpg\"#" _site/index.html

      - name: Publicar
        run: npx wrangler pages deploy _site --project-name="$PROJECT" --branch="$BRANCH" --commit-dirty=true

      - name: Endereço do site
        run: |
          echo "Site no ar: $SITE_URL"
          echo "Site no ar: $SITE_URL" >> "$GITHUB_STEP_SUMMARY"
