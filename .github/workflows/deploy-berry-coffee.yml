# Publica o site da The Berry Coffee no Cloudflare, sempre no mesmo link:
#   https://theberrycoffee.<subdomínio-da-conta>.workers.dev
# Cada push que mexe em berry-coffee/ (no main ou no branch claude/keen-tesla-fjkq02) atualiza esse link.
#
# O site vai como Worker com arquivos estáticos (Workers Static Assets), e não como projeto do
# Cloudflare Pages: a conta já tem 100 projetos no Pages, o limite do Cloudflare (erro 8000027).
#
# Usa os secrets/variáveis dos outros sites do repositório (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   token do Cloudflare que pode publicar Workers (obrigatório)
#   CLOUDFLARE_ACCOUNT_ID  ID da conta (opcional: sem ele, o workflow descobre a conta pelo token)
# Enquanto o token não existir, o workflow só avisa e não falha.
name: Deploy The Berry Coffee (Cloudflare)

on:
  push:
    branches: [main, claude/keen-tesla-fjkq02]
    paths:
      - 'berry-coffee/**'
      - '.github/workflows/deploy-berry-coffee.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: berry-coffee-deploy
  cancel-in-progress: false

env:
  WORKER: theberrycoffee

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.creds.outputs.ready }}
    steps:
      - name: Conferir o token do Cloudflare
        id: creds
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Cloudflare sem credenciais::Falta o secret CLOUDFLARE_API_TOKEN. Cadastre em Settings → Secrets and variables → Actions e rode de novo (abra a execução em Actions → Re-run all jobs)."
          fi

  deploy:
    needs: check
    if: needs.check.outputs.ready == 'true'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ACCOUNT_SECRET: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Instalar o wrangler
        run: npm install --no-save --no-audit --no-fund --include=optional wrangler@4

      - name: Conta do Cloudflare
        run: |
          id="$ACCOUNT_SECRET"
          if [ -z "$id" ]; then
            # Sem o secret, descobre a conta pelo próprio token
            auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
            id=$(curl -sS -H "$auth" "https://api.cloudflare.com/client/v4/accounts?per_page=50" | jq -r '.result[]?.id')
            if [ -z "$id" ]; then
              id=$(curl -sS -H "$auth" "https://api.cloudflare.com/client/v4/memberships?per_page=50" | jq -r '.result[]?.account.id')
            fi
            count=$(printf '%s\n' "$id" | grep -c . || true)
            if [ "$count" != "1" ]; then
              echo "::error title=Conta do Cloudflare::O token dá acesso a $count contas. Cadastre o secret CLOUDFLARE_ACCOUNT_ID com o ID da conta certa (Cloudflare → Workers & Pages → Account ID)."
              exit 1
            fi
            echo "::add-mask::$id"
            echo "Conta encontrada pelo token."
          fi
          echo "CLOUDFLARE_ACCOUNT_ID=$id" >> "$GITHUB_ENV"

      - name: Endereço do site e conferência do nome
        run: |
          acc="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          sub=$(curl -sS -H "$auth" "$acc/workers/subdomain" | jq -r '.result.subdomain // empty')
          if [ -z "$sub" ]; then
            echo "::error title=workers.dev::A conta não tem subdomínio workers.dev. Crie em Cloudflare → Workers & Pages → (lado direito) Subdomain e rode de novo."
            exit 1
          fi
          url="https://$WORKER.$sub.workers.dev"
          echo "SITE_URL=$url" >> "$GITHUB_ENV"
          # Não sobrescreve um Worker com o mesmo nome que não seja este site
          if curl -sS -H "$auth" "$acc/workers/scripts/$WORKER/settings" | jq -e '.success' > /dev/null; then
            if curl -fsS --max-time 20 "$url/sitemap.xml" | grep -q "theberrycoffee.ie"; then
              echo "O Worker $WORKER já é este site: vai ser atualizado."
            else
              echo "::error title=Nome em uso::Já existe um Worker chamado $WORKER nesta conta que não é este site. Apague ou renomeie esse Worker, ou troque WORKER no topo deste workflow."
              exit 1
            fi
          else
            echo "Primeira publicação: o Worker $WORKER vai ser criado."
          fi

      - name: Montar o site
        run: |
          mkdir -p _site
          cp -R berry-coffee/. _site/
          # O README tem anotações internas e não vai para o ar
          rm -f _site/README.md
          # O WhatsApp só mostra a imagem da prévia do link com o endereço completo
          sed -i "s#content=\"assets/img/og-image.jpg\"#content=\"$SITE_URL/assets/img/og-image.jpg\"#" _site/index.html
          cat > wrangler.jsonc <<EOF
          {
            "name": "$WORKER",
            "compatibility_date": "2025-10-01",
            "workers_dev": true,
            "preview_urls": false,
            "assets": {
              "directory": "./_site",
              "not_found_handling": "404-page",
              "html_handling": "auto-trailing-slash"
            }
          }
          EOF

      - name: Publicar
        run: npx wrangler deploy --config wrangler.jsonc

      - name: Conferir o site no ar
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS --max-time 20 "$SITE_URL/" | grep -q "Good food"; then
              echo "Site no ar: $SITE_URL"
              echo "### Site no ar: $SITE_URL" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo "::warning title=Site ainda não respondeu::A publicação terminou, mas $SITE_URL ainda não respondeu. Tente abrir de novo em alguns minutos."
          echo "### Publicado em: $SITE_URL (ainda carregando)" >> "$GITHUB_STEP_SUMMARY"
