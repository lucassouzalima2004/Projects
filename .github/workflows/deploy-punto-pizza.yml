# Publica o site da Punto Pizza no Cloudflare, sempre no mesmo link:
#   https://puntopizza.<subdomínio da conta>.workers.dev  (o endereço exato aparece no resumo da execução)
# Cada push que mexe em punto-pizza/ (no main ou no branch claude/inspiring-gates-bp5orb) atualiza esse link.
#
# Vai como Worker com arquivos estáticos (Workers Static Assets), como a Black Rock Floors e a The Berry Coffee,
# porque a conta já chegou ao limite de projetos do Cloudflare Pages.
#
# Usa os mesmos secrets dos outros sites do repositório (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   token do Cloudflare que pode publicar Workers (obrigatório)
#   CLOUDFLARE_ACCOUNT_ID  ID da conta (opcional: sem ele, o workflow descobre a conta pelo token)
#
# Domínio do Carlos (puntopizzaverona.it): a cada execução o workflow confere se ele já está nesta conta do Cloudflare.
#   - Ainda não está: o resumo da execução explica como adicionar.
#   - Está, mas os nameservers ainda são os da Register.it: o resumo mostra os dois nameservers para mandar ao Carlos.
#   - Ativo: liga puntopizzaverona.it e www.puntopizzaverona.it ao site e passa a usar https://puntopizzaverona.it
#     no canonical, no sitemap e na prévia do link. Para usar outro endereço, crie a variável opcional
#     PUNTOPIZZA_SITE_URL (Settings → Secrets and variables → Actions → Variables).
# Enquanto o token não existir, o workflow só avisa e não falha.
name: Deploy Punto Pizza (Cloudflare)

on:
  push:
    branches: [main, claude/inspiring-gates-bp5orb]
    paths:
      - 'punto-pizza/**'
      - '.github/workflows/deploy-punto-pizza.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: punto-pizza-deploy
  cancel-in-progress: false

env:
  WORKER: puntopizza
  DOMAIN: puntopizzaverona.it

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.creds.outputs.ready }}
    steps:
      - name: Conferir o token do Cloudflare
        id: creds
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Cloudflare sem credenciais::Falta o secret CLOUDFLARE_API_TOKEN. Cadastre em Settings → Secrets and variables → Actions e rode de novo (abra a execução em Actions → Re-run all jobs)."
          fi

  deploy:
    needs: check
    if: needs.check.outputs.ready == 'true'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ACCOUNT_SECRET: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      SITE_VAR: ${{ vars.PUNTOPIZZA_SITE_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Instalar o wrangler
        run: npm install --no-save --no-audit --no-fund --include=optional wrangler@4

      - name: Conta do Cloudflare
        run: |
          id="$ACCOUNT_SECRET"
          if [ -z "$id" ]; then
            # Sem o secret, descobre a conta pelo próprio token
            auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
            id=$(curl -sS -H "$auth" "https://api.cloudflare.com/client/v4/accounts?per_page=50" | jq -r '.result[]?.id')
            if [ -z "$id" ]; then
              id=$(curl -sS -H "$auth" "https://api.cloudflare.com/client/v4/memberships?per_page=50" | jq -r '.result[]?.account.id')
            fi
            count=$(printf '%s\n' "$id" | grep -c . || true)
            if [ "$count" != "1" ]; then
              echo "::error title=Conta do Cloudflare::O token dá acesso a $count contas. Cadastre o secret CLOUDFLARE_ACCOUNT_ID com o ID da conta certa (Cloudflare → Workers & Pages → Account ID)."
              exit 1
            fi
            echo "::add-mask::$id"
            echo "Conta encontrada pelo token."
          fi
          echo "CLOUDFLARE_ACCOUNT_ID=$id" >> "$GITHUB_ENV"

      - name: Domínio do Carlos
        run: |
          # Só usa o domínio quando ele já está nesta conta e ativo (nameservers trocados na Register.it)
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          res=$(curl -sS -H "$auth" "https://api.cloudflare.com/client/v4/zones?name=$DOMAIN&account.id=$CLOUDFLARE_ACCOUNT_ID" || true)
          zone=$(printf '%s' "$res" | jq -r '.result[0].id // empty' 2>/dev/null || true)
          status=$(printf '%s' "$res" | jq -r '.result[0].status // empty' 2>/dev/null || true)
          if [ -z "$zone" ]; then
            echo "O domínio $DOMAIN ainda não está nesta conta do Cloudflare (ou o token não pode ver domínios)."
            {
              echo "### Domínio $DOMAIN: ainda não está no Cloudflare"
              echo "Cloudflare → **Add a domain** → \`$DOMAIN\` (plano Free). Confira que o **MX mail.register.it** e os **dois TXT** (SPF e google-site-verification) foram importados: são o e-mail e o Search Console do Carlos."
              echo "Depois rode este workflow de novo (Actions → Deploy Punto Pizza → Run workflow): os nameservers para mandar ao Carlos aparecem aqui."
            } >> "$GITHUB_STEP_SUMMARY"
          elif [ "$status" != "active" ]; then
            ns=$(printf '%s' "$res" | jq -r '.result[0].name_servers // [] | join(" e ")')
            echo "::notice title=Domínio $DOMAIN::Esperando a troca dos nameservers na Register.it. Novos nameservers: $ns"
            {
              echo "### Domínio $DOMAIN: esperando a troca dos nameservers"
              echo "No painel da Register.it, trocar ns1.register.it e ns2.register.it por: **$ns**"
              echo "Quando o Cloudflare confirmar (status active), rode este workflow de novo: ele liga o domínio ao site."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Domínio $DOMAIN ativo no Cloudflare: vai ser ligado ao site."
            echo "ZONE_ID=$zone" >> "$GITHUB_ENV"
          fi

      - name: Endereço do site e conferência do nome
        run: |
          acc="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          sub=$(curl -sS -H "$auth" "$acc/workers/subdomain" | jq -r '.result.subdomain // empty')
          if [ -z "$sub" ]; then
            echo "::error title=workers.dev::A conta não tem subdomínio workers.dev. Crie em Cloudflare → Workers & Pages → (lado direito) Subdomain e rode de novo."
            exit 1
          fi
          url="https://$WORKER.$sub.workers.dev"
          echo "WORKERS_URL=$url" >> "$GITHUB_ENV"
          if [ -n "$ZONE_ID" ]; then site="${SITE_VAR:-https://$DOMAIN}"; else site="${SITE_VAR:-$url}"; fi
          echo "SITE_URL=${site%/}" >> "$GITHUB_ENV"
          # Não sobrescreve um Worker com o mesmo nome que não seja este site
          if curl -sS -H "$auth" "$acc/workers/scripts/$WORKER/settings" | jq -e '.success' > /dev/null; then
            if curl -fsS --max-time 20 "$url/" | grep -q "Punto Pizza"; then
              echo "O Worker $WORKER já é este site: vai ser atualizado."
            else
              echo "::error title=Nome em uso::Já existe um Worker chamado $WORKER nesta conta que não é este site. Apague ou renomeie esse Worker, ou troque WORKER no topo deste workflow."
              exit 1
            fi
          else
            echo "Primeira publicação: o Worker $WORKER vai ser criado."
          fi

      - name: Montar o site
        run: |
          mkdir -p _site
          cp -R punto-pizza/. _site/
          # Anotações internas e os scripts das imagens não vão para o ar
          rm -rf _site/README.md _site/tools
          today=$(date -u +%F)
          : > pages.txt
          # Em cada página: endereço completo no og:image (o WhatsApp exige), canonical e og:url
          { echo _site/index.html; find _site -mindepth 2 -name 'index.html' | sort; } | while read -r f; do
            rel="${f#_site/}"
            path="/${rel%index.html}"
            sed -i -E "s#content=\"(\.\./)*assets/img/og-image.jpg\"#content=\"$SITE_URL/assets/img/og-image.jpg\"#" "$f"
            sed -i "0,/<\/title>/s#</title>#</title>\n  <link rel=\"canonical\" href=\"$SITE_URL$path\">\n  <meta property=\"og:url\" content=\"$SITE_URL$path\">#" "$f"
            echo "$path" >> pages.txt
          done
          sed -i "s#content=\"/assets/img/og-image.jpg\"#content=\"$SITE_URL/assets/img/og-image.jpg\"#" _site/404.html
          {
            echo '<?xml version="1.0" encoding="UTF-8"?>'
            echo '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">'
            while read -r p; do echo "  <url><loc>$SITE_URL$p</loc><lastmod>$today</lastmod></url>"; done < pages.txt
            echo '</urlset>'
          } > _site/sitemap.xml
          printf 'User-agent: *\nAllow: /\n\nSitemap: %s/sitemap.xml\n' "$SITE_URL" > _site/robots.txt
          cat _site/sitemap.xml
          cat > wrangler.jsonc <<EOF
          {
            "name": "$WORKER",
            "compatibility_date": "2025-10-01",
            "workers_dev": true,
            "preview_urls": false,
            "assets": {
              "directory": "./_site",
              "not_found_handling": "404-page",
              "html_handling": "auto-trailing-slash"
            }
          }
          EOF

      - name: Publicar
        run: npx wrangler deploy --config wrangler.jsonc

      - name: Ligar o domínio ao site
        if: env.ZONE_ID != ''
        run: |
          acc="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          for host in "$DOMAIN" "www.$DOMAIN"; do
            # Já ligado a este site? Então não mexe em nada
            cur=$(curl -sS -H "$auth" "$acc/workers/domains?hostname=$host" | jq -r '.result[0].service // empty' 2>/dev/null || true)
            if [ "$cur" = "$WORKER" ]; then echo "$host já está ligado ao Worker $WORKER."; continue; fi
            # Os registros A/AAAA/CNAME deste endereço ainda apontam para o site antigo: saem agora (MX e TXT ficam)
            curl -sS -H "$auth" "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records?name=$host&per_page=50" \
              | jq -r '.result[]? | select(.type == "A" or .type == "AAAA" or .type == "CNAME") | .id' 2>/dev/null \
              | while read -r rid; do
                  curl -sS -X DELETE -H "$auth" "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records/$rid" > /dev/null && echo "Registro antigo de $host removido."
                done || true
            body=$(jq -nc --arg h "$host" --arg s "$WORKER" --arg z "$ZONE_ID" '{hostname: $h, service: $s, zone_id: $z, environment: "production"}')
            res=$(curl -sS -X PUT -H "$auth" -H "Content-Type: application/json" "$acc/workers/domains" -d "$body" || true)
            if printf '%s' "$res" | jq -e '.success' > /dev/null 2>&1; then
              echo "$host ligado ao Worker $WORKER."
            else
              msg=$(printf '%s' "$res" | jq -r '[.errors[]?.message] | join("; ")' 2>/dev/null || true)
              echo "::warning title=Domínio $host::Não deu para ligar ao site: ${msg:-$res}. Se falar de permissão, o token precisa também de Zone → Workers Routes → Edit e Zone → DNS → Edit; ou ligue à mão em Workers & Pages → $WORKER → Settings → Domains & Routes → Add → Custom domain (apagando antes, em DNS, os registros A/CNAME antigos de $host)."
            fi
          done

      - name: Conferir o site no ar
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS --max-time 20 "$WORKERS_URL/" | grep -q "fatta come si deve"; then
              echo "Site no ar: $WORKERS_URL"
              echo "### Site no ar: $WORKERS_URL" >> "$GITHUB_STEP_SUMMARY"
              if [ "$SITE_URL" != "$WORKERS_URL" ]; then
                echo "Endereço oficial (canonical e sitemap): $SITE_URL" >> "$GITHUB_STEP_SUMMARY"
              fi
              exit 0
            fi
            sleep 10
          done
          echo "::warning title=Site ainda não respondeu::A publicação terminou, mas $WORKERS_URL ainda não respondeu. Tente abrir de novo em alguns minutos."
          echo "### Publicado em: $WORKERS_URL (ainda carregando)" >> "$GITHUB_STEP_SUMMARY"

      - name: Conferir o domínio
        if: env.ZONE_ID != ''
        run: |
          # O certificado do domínio pode levar alguns minutos na primeira vez: aqui só avisa, não falha
          for i in 1 2 3 4 5 6 7 8; do
            if curl -fsS --max-time 20 "https://$DOMAIN/" | grep -q "fatta come si deve"; then
              echo "Site no ar no domínio: https://$DOMAIN"
              echo "### No domínio do Carlos: https://$DOMAIN" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 15
          done
          echo "::warning title=Domínio ainda carregando::https://$DOMAIN ainda não mostra o site novo. O certificado pode levar alguns minutos; abra de novo daqui a pouco."
