# Publica o site da Bora Signs no Cloudflare, sempre no mesmo link:
#   https://bora-signs.<subdomínio da conta>.workers.dev  (o endereço exato aparece no resumo da execução)
#
# Vai como Worker (a conta já chegou ao limite de projetos do Cloudflare Pages): os arquivos estáticos (CSS, JS, fotos e o
# painel em /admin) e um Worker que monta as páginas a partir do conteúdo publicado no painel. O conteúdo, as fotos
# enviadas, as mensagens e os usuários do painel ficam no Workers KV "bora-signs-cms", que este workflow cria na primeira vez.
#
# Usa os mesmos secrets dos outros sites (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   token do Cloudflare que pode publicar Workers e mexer no Workers KV (obrigatório)
#   CLOUDFLARE_ACCOUNT_ID  ID da conta (opcional: sem ele, o workflow descobre a conta pelo token)
#
# O endereço oficial do site fica no painel (Configurações → SEO). Só ele aparece no Google; o link workers.dev fica fora
# (noindex) para não competir com o site atual no Wix. Enquanto o token não existir, o workflow só avisa e não falha.
name: Deploy Bora Signs (Cloudflare)

on:
  push:
    branches: [main, claude/trusting-pasteur-mwwc40]
    paths:
      - 'bora-signs/**'
      - '.github/workflows/deploy-bora-signs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bora-signs-deploy
  cancel-in-progress: false

env:
  WORKER: bora-signs

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.creds.outputs.ready }}
    steps:
      - name: Conferir o token do Cloudflare
        id: creds
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Cloudflare sem credenciais::Falta o secret CLOUDFLARE_API_TOKEN. Cadastre em Settings → Secrets and variables → Actions e rode de novo."
          fi

  deploy:
    needs: check
    if: needs.check.outputs.ready == 'true'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ACCOUNT_SECRET: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      KV_TITLE: bora-signs-cms
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Conta do Cloudflare
        run: |
          id="$ACCOUNT_SECRET"
          if [ -z "$id" ]; then
            # Sem o secret, descobre a conta pelo próprio token
            auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
            id=$(curl -sS -H "$auth" "https://api.cloudflare.com/client/v4/accounts?per_page=50" | jq -r '.result[]?.id')
            if [ -z "$id" ]; then
              id=$(curl -sS -H "$auth" "https://api.cloudflare.com/client/v4/memberships?per_page=50" | jq -r '.result[]?.account.id')
            fi
            count=$(printf '%s\n' "$id" | grep -c . || true)
            if [ "$count" != "1" ]; then
              echo "::error title=Conta do Cloudflare::O token dá acesso a $count contas. Cadastre o secret CLOUDFLARE_ACCOUNT_ID com o ID da conta certa."
              exit 1
            fi
            echo "::add-mask::$id"
          fi
          echo "CLOUDFLARE_ACCOUNT_ID=$id" >> "$GITHUB_ENV"

      - name: Endereço da prévia e conferência do nome
        run: |
          acc="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          sub=$(curl -sS -H "$auth" "$acc/workers/subdomain" | jq -r '.result.subdomain // empty')
          if [ -z "$sub" ]; then
            echo "::error title=workers.dev::A conta não tem subdomínio workers.dev. Crie em Cloudflare → Workers & Pages → Subdomain e rode de novo."
            exit 1
          fi
          url="https://$WORKER.$sub.workers.dev"
          echo "PREVIEW_URL=$url" >> "$GITHUB_ENV"
          # Não sobrescreve um Worker com o mesmo nome que não seja este site
          if curl -sS -H "$auth" "$acc/workers/scripts/$WORKER/settings" | jq -e '.success' > /dev/null; then
            if curl -fsS --max-time 20 "$url/" | grep -q "Bora Signs"; then
              echo "O Worker $WORKER já é este site: vai ser atualizado."
            else
              echo "::error title=Nome em uso::Já existe um Worker chamado $WORKER nesta conta que não é este site. Troque WORKER no topo deste workflow."
              exit 1
            fi
          else
            echo "Primeira publicação: o Worker $WORKER vai ser criado."
          fi

      - name: Armazenamento do painel (Workers KV)
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces"
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          list=$(curl -sS -H "$auth" "$api?per_page=100")
          if [ "$(echo "$list" | jq -r '.success')" != "true" ]; then
            echo "$list" | jq -c '.errors' || true
            echo "::error title=Workers KV::O token do Cloudflare não pode ler o Workers KV. Edite o token em Cloudflare → My Profile → API Tokens e inclua a permissão Account → Workers KV Storage → Edit."
            exit 1
          fi
          id=$(echo "$list" | jq -r --arg t "$KV_TITLE" '.result[] | select(.title == $t) | .id' | head -1)
          if [ -z "$id" ]; then
            created=$(curl -sS -X POST -H "$auth" -H "Content-Type: application/json" --data "{\"title\":\"$KV_TITLE\"}" "$api")
            id=$(echo "$created" | jq -r '.result.id // empty')
            if [ -z "$id" ]; then
              echo "$created" | jq -c '.errors' || true
              echo "::error title=Workers KV::Não deu para criar o KV $KV_TITLE. O token precisa da permissão Account → Workers KV Storage → Edit."
              exit 1
            fi
            echo "KV $KV_TITLE criado."
          else
            echo "KV $KV_TITLE já existe."
          fi
          echo "KV_ID=$id" >> "$GITHUB_ENV"

      - name: Montar o site
        run: |
          node bora-signs/build.mjs
          cat > wrangler.jsonc <<EOF
          {
            "name": "$WORKER",
            "main": "./bora-signs/worker/index.mjs",
            "compatibility_date": "2025-10-01",
            "workers_dev": true,
            "preview_urls": false,
            "assets": {
              "directory": "./bora-signs/dist",
              "binding": "ASSETS",
              "not_found_handling": "none",
              "html_handling": "auto-trailing-slash"
            },
            "kv_namespaces": [{ "binding": "CMS", "id": "$KV_ID" }],
            "observability": { "enabled": true }
          }
          EOF

      - name: Publicar
        run: npx --yes wrangler@4 deploy --config wrangler.jsonc

      - name: Conferir o site no ar
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS --max-time 20 "$PREVIEW_URL/vehicle-signage" | grep -q "Drag to" \
              && curl -fsS --max-time 20 "$PREVIEW_URL/admin/" | grep -q "Painel" \
              && [ "$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$PREVIEW_URL/api/me")" = "401" ]; then
              echo "Site no ar: $PREVIEW_URL"
              {
                echo "### Bora Signs no ar: $PREVIEW_URL"
                echo "Painel: $PREVIEW_URL/admin"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo "::warning title=Site ainda carregando::A publicação terminou, mas $PREVIEW_URL ainda não respondeu como esperado. Abra de novo em alguns minutos."
          echo "### Publicado em: $PREVIEW_URL (ainda carregando)" >> "$GITHUB_STEP_SUMMARY"
