# Publica a loja Art with Love como Cloudflare Worker
# (https://artwithlove-by-lulu.lucassouzalima10.workers.dev). Configuração em art-with-love/wrangler.jsonc.
#
# Secrets no GitHub (Settings → Secrets and variables → Actions → New repository secret):
#   CLOUDFLARE_API_TOKEN   token do Cloudflare com permissão para editar Workers
#   CLOUDFLARE_ACCOUNT_ID  ID da conta do Cloudflare
#   STRIPE_SECRET_KEY      opcional: chave secreta do Stripe. Sem ela, a sacola fecha o pedido pelo WhatsApp.
# Enquanto os secrets do Cloudflare não existirem, o workflow só avisa e não falha.
name: Deploy Art with Love (Cloudflare Workers)

on:
  push:
    branches: [main, claude/modest-wright-jq1dqx]
    paths:
      - 'art-with-love/**'
      - '.github/workflows/deploy-art-with-love.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: art-with-love
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.creds.outputs.ready }}
    steps:
      - name: Conferir os secrets do Cloudflare
        id: creds
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Cloudflare sem credenciais::Adicione CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID em Settings → Secrets and variables → Actions e rode este workflow de novo (Actions → Deploy Art with Love → Run workflow)."
          fi

  deploy:
    needs: check
    if: needs.check.outputs.ready == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: art-with-love
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Instalar o wrangler
        run: npm install --no-save --no-audit --no-fund --include=optional wrangler@4

      - name: Publicar
        id: deploy
        run: |
          set -o pipefail
          npx wrangler deploy | tee deploy.log
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | tail -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Guardar a chave do Stripe no Cloudflare
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        run: |
          if [ -z "$STRIPE_SECRET_KEY" ]; then
            echo "::notice title=Stripe desligado::Sem STRIPE_SECRET_KEY, a sacola fecha o pedido pelo WhatsApp."
            exit 0
          fi
          printf '%s' "$STRIPE_SECRET_KEY" | npx wrangler secret put STRIPE_SECRET_KEY

      - name: Endereço da loja
        run: echo "### Art with Love no ar: ${{ steps.deploy.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
