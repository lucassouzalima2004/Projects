# Publica o site da Bora Decor no Cloudflare (Worker "boradecor"), que responde em https://boradecor.com.au
# (domínio ligado no painel do Cloudflare) e em https://boradecor.<subdomínio da conta>.workers.dev.
# Cada push que mexe em bora-decor/ (no main ou no branch claude/amazing-goodall-z4s27u) atualiza o site.
#
# O Worker serve os arquivos do site e também recebe os pedidos de orçamento (/api/quote, código em
# bora-decor/worker/), que manda por e-mail, com as fotos, pela API do Resend.
#
# Secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN     token do Cloudflare que pode publicar Workers (obrigatório)
#   CLOUDFLARE_ACCOUNT_ID    ID da conta (opcional: sem ele, o workflow descobre a conta pelo token)
#   BORADECOR_RESEND_KEY     chave da API do Resend (resend.com), que manda os pedidos de orçamento por e-mail.
#                            Sem ela o site funciona, mas o formulário mostra o plano B (e-mail escrito para a pessoa mandar).
# Variáveis opcionais (mesma tela, aba Variables):
#   BORADECOR_SITE_URL       endereço oficial (padrão https://boradecor.com.au): canonical, sitemap e prévia do link
#   BORADECOR_QUOTE_FROM     remetente dos pedidos (padrão info@boradecor.com.au; o domínio precisa estar verificado no Resend)
#   BORADECOR_QUOTE_TO       quem recebe os pedidos (padrão info@boradecor.com.au; vários: separe por vírgula)
#
# O domínio NÃO é declarado no wrangler.jsonc de propósito: assim o deploy não mexe nos domínios ligados no painel.
# Enquanto o token não existir, o workflow só avisa e não falha.
name: Deploy Bora Decor (Cloudflare)

on:
  push:
    branches: [main, claude/amazing-goodall-z4s27u]
    paths:
      - 'bora-decor/**'
      - '.github/workflows/deploy-bora-decor.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bora-decor-deploy
  cancel-in-progress: false

env:
  WORKER: boradecor

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.creds.outputs.ready }}
    steps:
      - name: Conferir o token do Cloudflare
        id: creds
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Cloudflare sem credenciais::Falta o secret CLOUDFLARE_API_TOKEN. Cadastre em Settings → Secrets and variables → Actions e rode de novo (abra a execução em Actions → Re-run all jobs)."
          fi

  deploy:
    needs: check
    if: needs.check.outputs.ready == 'true'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ACCOUNT_SECRET: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      SITE_VAR: ${{ vars.BORADECOR_SITE_URL || 'https://boradecor.com.au' }}
      RESEND_KEY: ${{ secrets.BORADECOR_RESEND_KEY }}
      QUOTE_FROM: ${{ vars.BORADECOR_QUOTE_FROM || 'info@boradecor.com.au' }}
      QUOTE_TO: ${{ vars.BORADECOR_QUOTE_TO || 'info@boradecor.com.au' }}
    steps:
      - uses: actions/checkout@v4

      - name: Instalar o wrangler
        run: npm install --no-save --no-audit --no-fund --include=optional wrangler@4

      - name: Conta do Cloudflare
        run: |
          id="$ACCOUNT_SECRET"
          if [ -z "$id" ]; then
            # Sem o secret, descobre a conta pelo próprio token
            auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
            id=$(curl -sS -H "$auth" "https://api.cloudflare.com/client/v4/accounts?per_page=50" | jq -r '.result[]?.id')
            if [ -z "$id" ]; then
              id=$(curl -sS -H "$auth" "https://api.cloudflare.com/client/v4/memberships?per_page=50" | jq -r '.result[]?.account.id')
            fi
            count=$(printf '%s\n' "$id" | grep -c . || true)
            if [ "$count" != "1" ]; then
              echo "::error title=Conta do Cloudflare::O token dá acesso a $count contas. Cadastre o secret CLOUDFLARE_ACCOUNT_ID com o ID da conta certa (Cloudflare → Workers & Pages → Account ID)."
              exit 1
            fi
            echo "::add-mask::$id"
            echo "Conta encontrada pelo token."
          fi
          echo "CLOUDFLARE_ACCOUNT_ID=$id" >> "$GITHUB_ENV"

      - name: Endereço do site e conferência do nome
        run: |
          acc="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          sub=$(curl -sS -H "$auth" "$acc/workers/subdomain" | jq -r '.result.subdomain // empty')
          if [ -z "$sub" ]; then
            echo "::error title=workers.dev::A conta não tem subdomínio workers.dev. Crie em Cloudflare → Workers & Pages → (lado direito) Subdomain e rode de novo."
            exit 1
          fi
          url="https://$WORKER.$sub.workers.dev"
          echo "WORKERS_URL=$url" >> "$GITHUB_ENV"
          site="${SITE_VAR:-$url}"
          echo "SITE_URL=${site%/}" >> "$GITHUB_ENV"
          # Não sobrescreve um Worker com o mesmo nome que não seja este site
          if curl -sS -H "$auth" "$acc/workers/scripts/$WORKER/settings" | jq -e '.success' > /dev/null; then
            if curl -fsS --max-time 20 "$url/" | grep -q "Bora Decor"; then
              echo "O Worker $WORKER já é este site: vai ser atualizado."
            else
              echo "::error title=Nome em uso::Já existe um Worker chamado $WORKER nesta conta que não é este site. Apague ou renomeie esse Worker, ou troque WORKER no topo deste workflow."
              exit 1
            fi
          else
            echo "Primeira publicação: o Worker $WORKER vai ser criado."
          fi

      - name: Montar o site
        run: |
          mkdir -p _site
          cp -R bora-decor/. _site/
          # Anotações internas e os scripts das imagens/vídeo não vão para o ar
          rm -rf _site/README.md _site/tools _site/worker _site/.gitignore
          today=$(date -u +%F)
          : > pages.txt
          # Em cada página: endereço completo no og:image (o WhatsApp exige), canonical, og:url e dados para o Google
          { echo _site/index.html; find _site -mindepth 2 -name 'index.html' | sort; } | while read -r f; do
            rel="${f#_site/}"
            path="/${rel%index.html}"
            sed -i -E "s#content=\"(\.\./)*assets/img/(og-[a-z-]+\.jpg)\"#content=\"$SITE_URL/assets/img/\2\"#" "$f"
            sed -i "0,/<\/title>/s#</title>#</title>\n  <link rel=\"canonical\" href=\"$SITE_URL$path\">\n  <meta property=\"og:url\" content=\"$SITE_URL$path\">#" "$f"
            sed -i -E "s#\"image\": \"(\.\./)*assets/img/(og-[a-z-]+\.jpg)\"#\"url\": \"$SITE_URL$path\",\n    \"image\": \"$SITE_URL/assets/img/\2\"#; s#\"logo\": \"(\.\./)*assets/img/logo.svg\"#\"logo\": \"$SITE_URL/assets/img/logo.svg\"#" "$f"
            grep -n "canonical\|og:image\|\"url\"\|\"logo\"" "$f"
            echo "$path" >> pages.txt
          done
          sed -i "s#content=\"/assets/img/og-image.jpg\"#content=\"$SITE_URL/assets/img/og-image.jpg\"#" _site/404.html
          {
            echo '<?xml version="1.0" encoding="UTF-8"?>'
            echo '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">'
            while read -r p; do echo "  <url><loc>$SITE_URL$p</loc><lastmod>$today</lastmod></url>"; done < pages.txt
            echo '</urlset>'
          } > _site/sitemap.xml
          printf 'User-agent: *\nAllow: /\n\nSitemap: %s/sitemap.xml\n' "$SITE_URL" > _site/robots.txt
          cat _site/sitemap.xml
          cat > wrangler.jsonc <<EOF
          {
            "name": "$WORKER",
            "main": "bora-decor/worker/index.js",
            "compatibility_date": "2025-10-01",
            "workers_dev": true,
            "preview_urls": false,
            "assets": {
              "directory": "./_site",
              "binding": "ASSETS",
              "not_found_handling": "404-page",
              "html_handling": "auto-trailing-slash"
            },
            "vars": {
              "QUOTE_TO": "$QUOTE_TO",
              "QUOTE_FROM": "$QUOTE_FROM",
              "QUOTE_FROM_NAME": "Bora Decor website"
            },
            "observability": { "enabled": true }
          }
          EOF

      - name: Publicar
        run: npx wrangler deploy --config wrangler.jsonc

      - name: Chave do Resend (e-mail dos orçamentos)
        run: |
          if [ -n "$RESEND_KEY" ]; then
            printf '%s' "$RESEND_KEY" | npx wrangler secret put RESEND_API_KEY --config wrangler.jsonc
          else
            acc="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
            if curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$acc/workers/scripts/$WORKER/secrets" | jq -e '.result[]? | select(.name == "RESEND_API_KEY")' > /dev/null; then
              echo "A chave do Resend (RESEND_API_KEY) já está no Worker."
            else
              echo "::warning title=Formulário sem e-mail::Cadastre o secret BORADECOR_RESEND_KEY (chave da API do Resend) e rode de novo. Até lá o formulário mostra o plano B (a pessoa manda o e-mail do próprio aplicativo)."
            fi
          fi

      - name: Conferir o site no ar
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS --max-time 20 "$WORKERS_URL/" | grep -q "a new look"; then
              echo "Site no ar: $WORKERS_URL"
              echo "### Site no ar: $SITE_URL" >> "$GITHUB_STEP_SUMMARY"
              echo "Também em: $WORKERS_URL" >> "$GITHUB_STEP_SUMMARY"
              # Formulário: um pedido vazio responde 422 (e-mail configurado) ou 503 (falta a senha)
              code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST -H 'content-type: application/json' --data '{}' "$WORKERS_URL/api/quote" || true)
              case "$code" in
                422) echo "Formulário de orçamento: pronto (e-mail configurado, pedidos vão para $QUOTE_TO)." >> "$GITHUB_STEP_SUMMARY" ;;
                503) echo "::warning title=Formulário sem e-mail::Falta a chave do Resend no Worker (secret BORADECOR_RESEND_KEY)."
                     echo "Formulário de orçamento: **falta a chave do Resend** (secret BORADECOR_RESEND_KEY)." >> "$GITHUB_STEP_SUMMARY" ;;
                *)   echo "Formulário de orçamento: resposta inesperada ($code)." >> "$GITHUB_STEP_SUMMARY" ;;
              esac
              exit 0
            fi
            sleep 10
          done
          echo "::warning title=Site ainda não respondeu::A publicação terminou, mas $WORKERS_URL ainda não respondeu. Tente abrir de novo em alguns minutos."
          echo "### Publicado em: $WORKERS_URL (ainda carregando)" >> "$GITHUB_STEP_SUMMARY"
