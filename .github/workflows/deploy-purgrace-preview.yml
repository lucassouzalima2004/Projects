# Publica a prévia online da PurGrace no Cloudflare Pages (https://purgrace-preview.pages.dev).
# É o tema novo com o catálogo da loja, para mostrar à cliente: carrinho, filtros, busca e idioma
# funcionam no navegador, o checkout não existe e as páginas ficam fora do Google (noindex).
#
# Usa os mesmos dois secrets do site da Bossa (Settings → Secrets and variables → Actions → New repository secret):
#   CLOUDFLARE_API_TOKEN   token do Cloudflare com a permissão "Account · Cloudflare Pages · Edit"
#   CLOUDFLARE_ACCOUNT_ID  ID da conta do Cloudflare
# Enquanto os secrets não existirem, o workflow só avisa e não falha.
name: Deploy PurGrace preview (Cloudflare Pages)

on:
  push:
    branches: [main, claude/ecommerce-seo-shopify-3hffxd]
    paths:
      - 'purgrace/theme/**'
      - 'purgrace/dev/**'
      - '.github/workflows/deploy-purgrace-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: purgrace-preview
  cancel-in-progress: true

env:
  PROJECT: purgrace-preview

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.creds.outputs.ready }}
    steps:
      - name: Conferir os secrets do Cloudflare
        id: creds
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          TOKEN_AS_VARIABLE: ${{ vars.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          missing=""
          [ -n "$TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$ACCOUNT" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -z "$missing" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=false" >> "$GITHUB_OUTPUT"
          echo "Faltando:$missing"
          if [ "$TOKEN_AS_VARIABLE" = "true" ]; then
            echo "::warning title=Token salvo como variável::CLOUDFLARE_API_TOKEN está em Variables. Apague de lá e salve na aba Secrets (Settings → Secrets and variables → Actions → Secrets)."
          fi
          echo "::warning title=Cloudflare sem credenciais::Faltando:$missing. Salve em Settings → Secrets and variables → Actions → aba Secrets → New repository secret, com o nome exato, e rode este workflow de novo."

  deploy:
    needs: check
    if: needs.check.outputs.ready == 'true'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: purgrace/dev/package-lock.json

      - name: Instalar as ferramentas da prévia
        working-directory: purgrace/dev
        run: npm ci --no-audit --no-fund

      - name: Criar o projeto no Cloudflare Pages (só na primeira vez)
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects"
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          if ! curl -fsS -o /dev/null -H "$auth" "$api/$PROJECT"; then
            curl -sS --fail-with-body -X POST -H "$auth" -H "Content-Type: application/json" \
              --data "{\"name\":\"$PROJECT\",\"production_branch\":\"main\"}" "$api"
          fi
          domain=$(curl -fsS -H "$auth" "$api/$PROJECT" | jq -r '.result.subdomain')
          echo "DOMAIN=$domain" >> "$GITHUB_ENV"

      - name: Montar a prévia
        working-directory: purgrace/dev
        run: PREVIEW_ORIGIN="https://$DOMAIN" npm run export

      - name: Publicar
        run: npx --yes wrangler@4 pages deploy purgrace/dist/site --project-name="$PROJECT" --branch=main --commit-dirty=true

      - name: Endereço da prévia
        run: |
          echo "Prévia no ar: https://$DOMAIN" >> "$GITHUB_STEP_SUMMARY"
