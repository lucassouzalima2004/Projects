# Publica o site da Jesten Construções (cliente: Elivelton Phillips) como Worker do Cloudflare, com o painel em /painel:
# https://elivelton-jesten.<subdomínio da conta>.workers.dev
#
# Usa os secrets dos outros sites (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   token do Cloudflare com permissão de editar Workers (obrigatório)
#   CLOUDFLARE_ACCOUNT_ID  ID da conta do Cloudflare. Pode ficar em Secrets ou em Variables; se não existir,
#                          o workflow tenta descobrir pelo próprio token (funciona quando o token vê uma conta só)
# E um secret só deste site:
#   JESTEN_ADMIN_PASSWORD  senha inicial do painel. Sem ele o site sobe normalmente, mas o painel avisa que está sem senha.
# O banco (visitas, fotos e vídeos enviados pelo painel, mensagens) é um Durable Object com SQLite, criado no primeiro deploy.
# Sem o token, o workflow só avisa e não falha.
name: Deploy Jesten Construções (Cloudflare)

on:
  push:
    branches: [main, claude/nice-thompson-e4mvtt]
    paths:
      - 'elivelton-jesten/**'
      - '.github/workflows/deploy-elivelton-jesten.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-elivelton-jesten-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.creds.outputs.ready }}
    steps:
      - name: Conferir o token do Cloudflare
        id: creds
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Cloudflare sem credenciais::Adicione o secret CLOUDFLARE_API_TOKEN em Settings → Secrets and variables → Actions e rode este workflow de novo (Actions → Deploy Jesten Construções → Run workflow)."
          fi

  deploy:
    needs: check
    if: needs.check.outputs.ready == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: elivelton-jesten
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ACCOUNT_SETTING: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      ADMIN_PASSWORD: ${{ secrets.JESTEN_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Descobrir a conta do Cloudflare
        run: |
          account="$ACCOUNT_SETTING"
          if [ -z "$account" ]; then
            accounts=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts?per_page=50" || true)
            count=$(jq -r '(.result // []) | length' <<<"$accounts" 2>/dev/null || echo 0)
            if [ "$count" = "1" ]; then
              account=$(jq -r '.result[0].id' <<<"$accounts")
              echo "Conta encontrada pelo token: $(jq -r '.result[0].name' <<<"$accounts")"
            else
              echo "::error title=Falta o ID da conta do Cloudflare::O token não mostrou uma conta única ($count). Salve o ID em Settings → Secrets and variables → Actions → New repository secret, com o nome CLOUDFLARE_ACCOUNT_ID (o ID aparece no Cloudflare em Workers & Pages, na lateral direita), e rode este workflow de novo."
              exit 1
            fi
          fi
          echo "CLOUDFLARE_ACCOUNT_ID=$account" >> "$GITHUB_ENV"

      - name: Instalar o wrangler
        run: npm install --no-save --no-audit --no-fund wrangler@4

      - name: Publicar
        run: |
          set -o pipefail
          # O commit vai no fim dos endereços do CSS e do JS, para os navegadores buscarem a versão nova
          npx wrangler deploy --var "BUILD_ID:${GITHUB_SHA::8}" | tee deploy.log
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -n 1 || true)
          echo "URL=$url" >> "$GITHUB_ENV"

      - name: Senha do painel
        if: env.ADMIN_PASSWORD != ''
        run: printf '%s' "$ADMIN_PASSWORD" | npx wrangler secret put ADMIN_PASSWORD

      - name: Endereço do site
        run: |
          {
            echo "Site no ar: ${URL:-veja o endereço no passo Publicar}"
            echo ""
            echo "Painel do cliente: ${URL:+$URL/painel}"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          if [ -z "$ADMIN_PASSWORD" ]; then
            echo "::warning title=Painel sem senha::Crie o secret JESTEN_ADMIN_PASSWORD (Settings → Secrets and variables → Actions) com a senha inicial do painel e rode este workflow de novo."
          fi
