# Publica o site da Jesten Construções (cliente: Elivelton Phillips) como Worker do Cloudflare, com o painel em /painel.
# O site mora na conta do Cloudflare do cliente: https://elivelton-jesten.jesten.workers.dev
#
# Secrets (Settings → Secrets and variables → Actions):
#   JESTEN_CLOUDFLARE_API_TOKEN   token da conta do cliente com permissão de editar Workers. Com ele, publica lá.
#   JESTEN_CLOUDFLARE_ACCOUNT_ID  ID dessa conta (opcional: sem ele, o workflow descobre pelo próprio token)
#   JESTEN_ADMIN_PASSWORD         senha do painel (opcional). Quando existe, é posta no Worker a cada deploy e serve para
#                                 recuperar o acesso; sem ela, vale a senha guardada no Cloudflare (ADMIN_PASSWORD).
# Sem JESTEN_CLOUDFLARE_API_TOKEN, usa os secrets dos outros sites (CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID) e
# publica na conta onde o site começou, como uma cópia que só redireciona para o endereço do cliente (MOVED_TO).
# O banco (visitas, fotos e vídeos enviados pelo painel, mensagens) é um Durable Object com SQLite, criado no primeiro deploy.
# Sem o token, o workflow só avisa e não falha.
name: Deploy Jesten Construções (Cloudflare)

on:
  push:
    branches: [main, claude/nice-thompson-e4mvtt]
    paths:
      - 'elivelton-jesten/**'
      - '.github/workflows/deploy-elivelton-jesten.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-elivelton-jesten-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.creds.outputs.ready }}
    steps:
      - name: Conferir o token do Cloudflare
        id: creds
        env:
          TOKEN: ${{ secrets.JESTEN_CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Cloudflare sem credenciais::Adicione o secret CLOUDFLARE_API_TOKEN em Settings → Secrets and variables → Actions e rode este workflow de novo (Actions → Deploy Jesten Construções → Run workflow)."
          fi

  deploy:
    needs: check
    if: needs.check.outputs.ready == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: elivelton-jesten
    env:
      # A conta do cliente tem prioridade; sem o token dela, publica na conta antiga só com o redirecionamento
      CLOUDFLARE_API_TOKEN: ${{ secrets.JESTEN_CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
      ACCOUNT_SETTING: ${{ secrets.JESTEN_CLOUDFLARE_API_TOKEN == '' && (secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID) || (secrets.JESTEN_CLOUDFLARE_ACCOUNT_ID || vars.JESTEN_CLOUDFLARE_ACCOUNT_ID || '') }}
      MOVED_TO: ${{ secrets.JESTEN_CLOUDFLARE_API_TOKEN == '' && 'https://elivelton-jesten.jesten.workers.dev' || '' }}
      ADMIN_PASSWORD: ${{ secrets.JESTEN_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Descobrir a conta do Cloudflare
        run: |
          account="$ACCOUNT_SETTING"
          if [ -z "$account" ]; then
            accounts=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts?per_page=50" || true)
            count=$(jq -r '(.result // []) | length' <<<"$accounts" 2>/dev/null || echo 0)
            if [ "$count" = "1" ]; then
              account=$(jq -r '.result[0].id' <<<"$accounts")
              echo "Conta encontrada pelo token: $(jq -r '.result[0].name' <<<"$accounts")"
            else
              echo "::error title=Falta o ID da conta do Cloudflare::O token não mostrou uma conta única ($count). Salve o ID em Settings → Secrets and variables → Actions → New repository secret, com o nome CLOUDFLARE_ACCOUNT_ID (o ID aparece no Cloudflare em Workers & Pages, na lateral direita), e rode este workflow de novo."
              exit 1
            fi
          fi
          echo "CLOUDFLARE_ACCOUNT_ID=$account" >> "$GITHUB_ENV"

      - name: Instalar o wrangler
        run: npm install --no-save --no-audit --no-fund wrangler@4

      - name: Publicar
        run: |
          set -o pipefail
          # O commit vai no fim dos endereços do CSS e do JS, para os navegadores buscarem a versão nova
          npx wrangler deploy --var "BUILD_ID:${GITHUB_SHA::8}" ${MOVED_TO:+--var "MOVED_TO:$MOVED_TO"} | tee deploy.log
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -n 1 || true)
          echo "URL=$url" >> "$GITHUB_ENV"

      - name: Senha do painel
        if: env.ADMIN_PASSWORD != ''
        run: printf '%s' "$ADMIN_PASSWORD" | npx wrangler secret put ADMIN_PASSWORD

      - name: Endereço do site
        run: |
          if [ -n "$MOVED_TO" ]; then
            echo "Cópia na conta antiga (${URL:-veja o passo Publicar}): redireciona tudo para $MOVED_TO. Para publicar na conta do cliente, crie o secret JESTEN_CLOUDFLARE_API_TOKEN." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "Site no ar: ${URL:-veja o endereço no passo Publicar}"
            echo ""
            echo "Painel do cliente: ${URL:+$URL/painel}"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          if ! npx wrangler secret list 2>/dev/null | grep -q '"ADMIN_PASSWORD"'; then
            echo "::warning title=Painel sem senha::Crie a senha do painel: secret JESTEN_ADMIN_PASSWORD no GitHub (e rode este workflow de novo) ou, no Cloudflare, Workers & Pages → elivelton-jesten → Settings → Variables and Secrets → ADMIN_PASSWORD (tipo Secret)."
          fi
