<!doctype html>
<!-- Imagem de prévia do link (assets/img/og-image.jpg, 1200x630).
     Para refazer: abra este arquivo num navegador com a janela em 1200x630 e tire um print,
     ou rode o comando que está no README (seção "Imagens"). -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,300..900&family=Instrument+Serif:ital@0;1&display=swap">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #141311; }
  .og { position: relative; width: 1200px; height: 630px; display: grid; grid-template-columns: 300px 1fr; align-items: center; gap: 64px; padding: 0 80px; box-sizing: border-box; color: #F2E9E2; font-family: 'Archivo', sans-serif; }
  .bg { position: absolute; inset: 0; background: url('../assets/img/hero-poster.jpg') center / cover; filter: saturate(.8); }
  .bg::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(20,19,17,.94) 0%, rgba(20,19,17,.8) 45%, rgba(20,19,17,.55) 100%); }
  .logo { position: relative; width: 260px; }
  .copy { position: relative; }
  .eyebrow { font-stretch: 125%; font-weight: 600; font-size: 17px; letter-spacing: .24em; text-transform: uppercase; color: #C8AD80; margin-bottom: 22px; }
  h1 { margin: 0; font-stretch: 125%; font-weight: 800; font-size: 62px; line-height: .98; letter-spacing: -.02em; text-transform: uppercase; }
  h1 em { display: block; font-family: 'Instrument Serif', serif; font-style: italic; font-weight: 400; font-stretch: 100%; text-transform: none; font-size: 108px; line-height: .95; color: #D9C29A; }
  .chips { display: flex; gap: 12px; margin-top: 30px; }
  .chips span { padding: 11px 18px; border-radius: 999px; border: 1px solid rgba(200,173,128,.55); font-size: 19px; font-weight: 600; }
  .chips span:first-child { background: #C8AD80; color: #1A1815; border-color: #C8AD80; }
</style>
</head>
<body>
  <div class="og">
    <div class="bg"></div>
    <img class="logo" src="../assets/img/logo.svg" alt="">
    <div class="copy">
      <div class="eyebrow">Kitchen wrapping · Adelaide</div>
      <h1>Give your kitchen <em>a new look</em></h1>
      <div class="chips"><span>10-year warranty</span><span>Most kitchens $3k–$6k</span></div>
    </div>
  </div>
</body>
</html>
